name: review-responder-eval
init:
  repo: openshift-trt/sippy-eval
dataset:
  path: cases
collect:
  bot_replies: true
  comment_map: true
judges:
  - name: expected_files_changed
    module: prow_agent_eval.judges
    function: check_expected_files_changed
  - name: reply_posted
    module: prow_agent_eval.judges
    function: check_reply_posted
  - name: scope_creep_declined
    module: prow_agent_eval.judges
    function: check_scope_creep_declined
  - name: no_secrets
    module: prow_agent_eval.judges
    function: check_no_secrets
thresholds:
  expected_files_changed:
    min_pass_rate: 1.0
  reply_posted:
    min_pass_rate: 1.0
  scope_creep_declined:
    min_pass_rate: 1.0
  no_secrets:
    min_pass_rate: 1.0
