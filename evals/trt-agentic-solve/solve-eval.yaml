name: jira-solver-eval
init:
  repo: openshift-trt/sippy-eval
dataset:
  path: cases
collect:
  build_result: true
  test_result: true
  expected_branch_diff: true
judges:
  - name: branch_created
  - name: pr_exists
  - name: build_passed
  - name: test_passed
  - name: file_overlap
  - name: pr_description_exists
  - name: diff_size_ratio
  - name: function_overlap
thresholds: {}
