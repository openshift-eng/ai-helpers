# Eval manifest for the openshift-claude-agent-eval-manifest runner (openshift/release).
# Contract: https://github.com/openshift/release/blob/main/hack/claude-agent-eval/README.md
#
# - The manifest owns CI routing: run mode, triggers, parallelism, orchestrator turns, setup.
# - Each eval YAML owns what is under test: model (models.skill), budget, timeouts, judges, thresholds.
#   CI evaluates exactly what is in the repo at the PR head; change an eval by changing its YAML in a PR.
# - triggers are literal path prefixes matched on whole path segments (not globs). List the eval
#   config, its cases, its skill, and any skills/scripts the skill reads from elsewhere.
# - eval_cases_dir enables changed-case selection: PRs that only touch cases run just those cases.
# - The runner executes only `run: pr` entries today. `manual` entries are listed so the manifest is
#   the complete inventory; they are validated but skipped (see the comment on each).

evals:

# ---------------------------------------------------------------------------
# PR-gated evals. Small datasets, up to about $15 worst case per run.
# ---------------------------------------------------------------------------

- config: plugins/code-review/evals/eval-classify-review-comment.yaml
  eval_cases_dir: plugins/code-review/evals/cases/classify-review-comment
  run: pr
  parallelism: 5
  max_turns: 100
  triggers:
  - plugins/code-review/evals/eval-classify-review-comment.yaml
  - plugins/code-review/evals/cases/classify-review-comment
  - plugins/code-review/skills/classify-review-comment

- config: plugins/openshift-developer/evals/eval-address-reviews.yaml
  eval_cases_dir: plugins/openshift-developer/evals/cases/address-reviews
  run: pr
  parallelism: 5
  max_turns: 100
  triggers:
  - plugins/openshift-developer/evals/eval-address-reviews.yaml
  - plugins/openshift-developer/evals/cases/address-reviews
  - plugins/openshift-developer/skills/address-review-pr
  - plugins/openshift-developer/skills/has-review-work/scripts/is_slash_command_only.py

- config: plugins/ci/evals/eval-detect-permafail.yaml
  eval_cases_dir: plugins/ci/evals/cases/detect-permafail
  run: pr
  parallelism: 5
  max_turns: 100
  triggers:
  - plugins/ci/evals/eval-detect-permafail.yaml
  - plugins/ci/evals/cases/detect-permafail
  - plugins/ci/skills/detect-permafail
  - plugins/ci/commands/detect-permafail.md

- config: plugins/jira/evals/eval-ready-to-solve.yaml
  eval_cases_dir: plugins/jira/evals/cases/ready-to-solve
  run: pr
  parallelism: 4
  max_turns: 100
  triggers:
  - plugins/jira/evals/eval-ready-to-solve.yaml
  - plugins/jira/evals/cases/ready-to-solve
  - plugins/jira/skills/ready-to-solve

- config: plugins/openshift-developer/evals/eval-address-ci-failures.yaml
  eval_cases_dir: plugins/openshift-developer/evals/cases/address-ci-failures
  run: pr
  parallelism: 4
  max_turns: 100
  triggers:
  - plugins/openshift-developer/evals/eval-address-ci-failures.yaml
  - plugins/openshift-developer/evals/cases/address-ci-failures
  - plugins/openshift-developer/skills/address-ci-failures
  - plugins/openshift-developer/skills/has-review-work/scripts
  - plugins/ci/skills/prow-job-analysis/references/flaky-test-identification.md

- config: plugins/openshift-developer/evals/eval-preassessment.yaml
  eval_cases_dir: plugins/openshift-developer/evals/cases/preassessment
  run: pr
  parallelism: 4
  max_turns: 100
  triggers:
  - plugins/openshift-developer/evals/eval-preassessment.yaml
  - plugins/openshift-developer/evals/cases/preassessment
  - plugins/openshift-developer/skills/preassessment

- config: plugins/openshift-developer/evals/eval-generate-test-plan.yaml
  eval_cases_dir: plugins/openshift-developer/evals/cases/generate-test-plan
  run: pr
  parallelism: 5
  max_turns: 100
  triggers:
  - plugins/openshift-developer/evals/eval-generate-test-plan.yaml
  - plugins/openshift-developer/evals/cases/generate-test-plan
  - plugins/openshift-developer/skills/generate-test-plan
  - plugins/ci/skills/fetch-jira-issue

# ---------------------------------------------------------------------------
# Listed but not yet PR-gated (the runner skips `manual`). Flip to `pr` per the rollout plan.
# ---------------------------------------------------------------------------

# Never run in CI (the legacy eval-jira-solve job has no recorded build). Prove it green on the
# fixed legacy job first, then flip to pr. Orchestrates skills across two plugins.
- config: plugins/openshift-developer/evals/eval-solve.yaml
  eval_cases_dir: plugins/openshift-developer/evals/cases/solve
  run: manual
  parallelism: 4
  max_turns: 100
  triggers:
  - plugins/openshift-developer/evals/eval-solve.yaml
  - plugins/openshift-developer/evals/cases/solve
  - plugins/openshift-developer/evals/stubs
  - plugins/openshift-developer/skills/jira-solve
  - plugins/openshift-developer/skills/check-gates
  - plugins/openshift-developer/skills/create-pr
  - plugins/openshift-developer/skills/implement
  - plugins/code-review/skills/pre-commit-review

# Heavy evals: about $75 to $425 worst case and hours of wall clock. These stay manual until the
# runner can isolate them from the cheap evals (eval groups: one pod and deadline per group).
# Until then the legacy jobs keep covering them.
- config: plugins/ci/evals/eval-bulk-triage-regressions.yaml
  eval_cases_dir: plugins/ci/evals/cases/bulk-triage-regressions
  run: manual
  parallelism: 5
  max_turns: 2500
  triggers:
  - plugins/ci/evals/eval-bulk-triage-regressions.yaml
  - plugins/ci/evals/cases/bulk-triage-regressions
  - plugins/ci/skills/bulk-triage-regressions
  - plugins/ci/skills/add-jira-triage-link
  - plugins/ci/skills/fetch-job-run-summary
  - plugins/ci/skills/fetch-regression-details

- config: plugins/ci/evals/eval-prow-job-analysis.yaml
  eval_cases_dir: plugins/ci/evals/cases/prow-job-analysis
  run: manual
  parallelism: 5
  max_turns: 2500
  setup_script: plugins/ci/evals/scripts/setup-prow-job-analysis.sh
  triggers:
  - plugins/ci/evals/eval-prow-job-analysis.yaml
  - plugins/ci/evals/cases/prow-job-analysis
  - plugins/ci/evals/scripts/setup-prow-job-analysis.sh
  - plugins/ci/skills/prow-job-analysis
  - plugins/ci/skills/analyze-disruption
  - plugins/must-gather/skills/must-gather-analyzer

- config: plugins/ci/evals/eval-payload-analysis.yaml
  eval_cases_dir: plugins/ci/evals/cases/payload-analysis
  run: manual
  parallelism: 5
  max_turns: 2500
  setup_script: plugins/ci/evals/scripts/extract-payload-analysis-snapshots.sh
  triggers:
  - plugins/ci/evals/eval-payload-analysis.yaml
  - plugins/ci/evals/cases/payload-analysis
  - plugins/ci/evals/scripts/extract-payload-analysis-snapshots.sh
  - plugins/ci/skills/payload-analysis
  - plugins/ci/skills/prow-job-analysis

# Snowflake: codex runner with an OpenAI model (skill and judges). CI has an OpenAI key (ci-claude-code /
# codex-openshift-ci, used by the payload agent), but the eval steps don't mount it yet.
- config: plugins/openshift-developer/evals/eval-jira-refine.yaml
  eval_cases_dir: plugins/openshift-developer/evals/cases/jira-refine
  run: manual
  parallelism: 2
  max_turns: 100
  triggers:
  - plugins/openshift-developer/evals/eval-jira-refine.yaml
  - plugins/openshift-developer/evals/cases/jira-refine
  - plugins/openshift-developer/evals/stubs
  - plugins/openshift-developer/skills/jira-refine
