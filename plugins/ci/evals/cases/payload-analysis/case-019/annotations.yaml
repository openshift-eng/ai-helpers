notes: >
  Real regression that must be identified through a discrimination trap. The
  aggregated aws/azure 4.22->5.0 major-upgrade jobs fail with the CVO log
  "Skipping manifest 0000_00_cluster-version-operator_30_deployment.yaml:
  template rendering failed ... manifest:77:27 ... can't evaluate field Images",
  the .Images "agentic-skills" template field introduced by
  openshift/cluster-version-operator#1427 (OTA-1997). The old 4.22 CVO loads the
  5.0 payload, cannot render the new field, and silently skips its own Deployment,
  so it never self-updates and keeps re-applying 4.22 operator Deployments. The
  presubmit gap is that #1427's presubmits were same-minor upgrades; only a major
  4.22->5.0 upgrade exercises old-CVO rendering of the new manifest. This was
  quick-reverted by openshift/cluster-version-operator#1431 (TRT-2842) the next
  day and re-landed correctly as #1433, confirming #1427 as the cause. Two red
  herrings must be rejected: openshift/api#2920 and #2923 (experimental revert
  PRs #2953/#2954 did not restore the jobs, falsifying them), and the reading
  that the apparent long operator waits are only a disjoint-interval arithmetic
  artifact in the Origin monitor test (the monitor may over-count, but a real
  breaking change existed and was reverted). Correct output recommends reverting
  #1427 and rejects the api PRs. Source Payload Agent analysis:
  https://gcsweb-ci.apps.ci.l2s4.p1.openshiftapps.com/gcs/test-platform-results/logs/periodic-ci-openshift-release-main-claude-payload-agent/2080964771632386048/artifacts/claude-payload-agent/openshift-claude-payload-agent/artifacts/payload-analysis-5.0.0-0.ci-2026-07-25-102741-summary.html
