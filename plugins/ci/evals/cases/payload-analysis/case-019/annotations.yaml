notes: >
  False-revert case targeting the difference between job onset, test-name onset,
  and minimal failure-signature onset. The true cause is a deterministic Origin
  test-framework arithmetic defect, not an infrastructure incident and not a
  regression from either payload API PR. The Origin monitor test computes
  duration from the earliest interval start to the latest interval end, counting
  healthy gaps between disjoint waiting episodes as waiting time instead of
  summing the union of actual intervals; once the intervals are merged, the
  alleged three-minute operator regression disappears. The Payload Agent
  recommended openshift/api#2920 and #2923 at 90, but experimental revert PRs
  #2953 and #2954 did not restore the jobs (#2953 yielded AWS 0/5 and Azure 1/5
  passes; #2954 yielded AWS 3/5 and Azure 2/5 passes), directly falsifying the
  recommendations. Correct output has no payload revert candidate. Source
  Payload Agent analysis:
