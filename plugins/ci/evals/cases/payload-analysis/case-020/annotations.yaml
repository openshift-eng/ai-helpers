notes: >
  Compound infrastructure and resilience case. The Payload Agent recommended
  openshift/ovn-kubernetes#3298 and openshift/cloud-provider-azure#164 at 90.
  Both are false causal attributions. Neither PR changed the executed trigger
  path: #3298 touched neither the panicking external-container adapter nor its
  call site (an informing helper that cannot reject the payload), and #164 did
  not change the empty VirtualMachine update that produced LocationRequired.
  The real failures are ordered infrastructure chains — for GCP, external VIP
  reachability loss precedes the setup panic and cleanup fallout; for AKS, DNS
  429 throttling precedes provisioning timeout before the CSI attach path
  amplifies the failure. The correct analysis distinguishes triggers from
  amplifiers, detectors, and cleanup fallout, and recommends no payload revert.
  Source Payload Agent analysis:
