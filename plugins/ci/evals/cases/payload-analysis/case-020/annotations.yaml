  - fact: >-
      Five distinct GCP VIPs were externally unreachable for roughly 701-713
      seconds before upgrade. Setup then panicked, cleanup was skipped, and leaked
      resources triggered downstream invariants. These are ordered roles in a
      causal chain, not proof that the informing test or PR #3298 was the trigger.
    artifacts:
