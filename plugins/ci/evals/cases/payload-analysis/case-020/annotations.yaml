    artifacts:
      - "5.0/nightly/5.0.0-0.nightly-2026-07-28-081944/azure-cloud-controller-manager, azure-cloud-node-manager/prs/164/code.diff"
      - "5.0/nightly/5.0.0-0.nightly-2026-07-29-055948/jobs/blocking/aggregated-hypershift-aks-conformance-5.0/junit/junit-aggregated.xml"

discriminating_signal: >-
  Decompose each job into minimal atomic signatures and preserve causal order.
  For GCP, external VIP reachability precedes setup panic and cleanup fallout.
  For AKS, DNS throttling precedes provisioning timeout and the CSI empty-VM PUT.
  A candidate must change the executed trigger path; neither #3298 nor #164 does.

notes: >
  Compound infrastructure and resilience case. The Payload Agent recommended
  openshift/ovn-kubernetes#3298 and openshift/cloud-provider-azure#164 at 90.
  Both are false causal attributions. The correct analysis can still identify
  product resilience and diagnostic defects: the external-container adapter
  should return a capability error rather than panic, cleanup must survive setup
  failure, HyperShift should gate on DNS readiness, and the Azure cloud provider
  must not send an empty VM update after a provisioning failure. Those follow-up
  fixes do not make the nearby payload PRs valid reverts. Source Payload Agent
  analysis:
