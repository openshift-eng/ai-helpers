name: ci-payload-analysis-eval
description: Evaluate the payload-analysis skill's ability to analyze OCP payload snapshots, trace root causes, correlate with PRs, and produce actionable HTML reports with revert recommendations
skill: ci:payload-analysis

execution:
  mode: case
  arguments: "{payload_tag} --snapshot-dir $EVAL_SNAPSHOT_DIR/{payload_tag} --as-of {payload_completed_at}"
  timeout: 3600
  max_budget_usd: 25.0
  env:
    EVAL_SNAPSHOT_DIR: $EVAL_SNAPSHOT_DIR
    GITHUB_TOKEN: $GITHUB_TOKEN

runner:
  type: claude-code
  plugin_dirs:
    - plugins/ci
  system_prompt: |
    You are a diligent senior OpenShift release engineer triaging failures.

    **CRITICAL**: You have many ci, must-gather, and jira skills at your
    disposal. You MUST load the relevant skills using the Skill tool BEFORE
    you begin any work. Do NOT improvise or guess. This applies equally to
    subagents: instruct every subagent to review its available skills and
    load the appropriate ones before beginning its investigation. A subagent
    that does not load a skill will produce shallow, unreliable analysis.

    After completing your analysis, you MUST use the Skill tool to invoke
    ci:payload-results-yaml and ci:payload-autodl-json to generate the
    structured output files. NEVER write these files directly — the skills
    enforce the canonical schema.

    Perform a point-in-time analysis as of the `--as-of` timestamp. Do not use
    later reverts, comments, subsequent payload outcomes, or the present-day
    absence of a revert as causal evidence. Timestamp-bound every external
    lookup and ignore results newer than the cutoff.

models:
  judge: claude-opus-4-6

permissions:
  allow:
    - "Skill"
    - "Bash"
    - "Agent"
    - "WebFetch"
    - "Write"
    - "Read"
  deny: []

mlflow:
  experiment: ci-payload-analysis-eval

dataset:
  path: plugins/ci/evals/cases/payload-analysis
  schema: |
    Each case directory contains:
    - input.yaml: YAML file with fields:
      - 'payload_tag' — a real payload tag from amd64.ocp.releases.ci.openshift.org
        (e.g., '5.0.0-0.nightly-2026-05-30-072431')
      - 'payload_completed_at' — exact ISO-8601 evidence cutoff, derived from
        the latest blocking-job completion in the payload
    - annotations.yaml: Expected outcomes and metadata for scoring:
      - 'expected_phase': Rejected|Ready|Accepted
      - 'expected_failed_job_count': integer
      - 'has_revert_candidates': boolean
      - 'force_accept_expected': boolean
      - 'analysis_cutoff': the same ISO-8601 timestamp as payload_completed_at
      - 'expected_candidates': list of expected revert candidates with pr_url,
        component, min_confidence, expected_confidence, description,
        expected_failing_jobs. The failing-job list is the candidate-specific
        subset it should explain and need not equal expected_failed_job_count.
      - 'expected_ci_config_issues': optional list of causal CI-configuration
        PRs outside the payload changelog, with pr_url, min_confidence,
        description, and expected_failing_jobs
      - 'forbidden_revert_candidates': PR URLs that must not be recommended at
        revert confidence or marked revert-eligible
      - 'required_claims': causal findings that must appear in the analysis;
        each entry supplies a name and a list of acceptable evidence phrases
      - 'notes': free text context

    Snapshots are stored as tar.gz archives in
    plugins/ci/evals/snapshots/payload-analysis/ and must be extracted before
    running evals. Run:
      export EVAL_SNAPSHOT_DIR=$(plugins/ci/evals/scripts/extract-payload-analysis-snapshots.sh <tag>)

outputs:
  - path: "output"
    schema: |
      The skill writes three files to the workspace root (not a subdirectory):
      1. payload-analysis-{sanitized_tag}-summary.html — self-contained HTML report
         with executive summary, blocking jobs summary table, recommended reverts
         (or no-revert verdict), optional force-accept recommendation, and per-job
         collapsible failure details. Uses GitHub dark mode styling with embedded CSS.
      2. payload-results-{sanitized_tag}.yaml — structured YAML with:
         - metadata: payload_tag, version, stream, architecture, release_controller_url,
           analyzed_at, force_accept_recommended
         - failing_jobs[]: job_name, prow_url, is_aggregated, underlying_job_name,
           failure_type, root_cause_summary, streak_length, originating_payload_tag,
           failure_pattern
         - candidates[]: pr_url, pr_number, component, title, confidence_score,
           rationale, revert_eligible, revert_gates, failing_jobs[], actions[]
      3. payload-analysis-{sanitized_tag}-autodl.json — flat denormalized JSON object
         with table_name, schema, and rows array. One row per (failed blocking job,
         candidate PR) pair. All row values are strings. Fields include payload_tag,
         version, stream, architecture, phase, job_name, prow_url, failure_type,
         root_cause_summary, candidate_pr_url, candidate_confidence_score.

      Judges should check outputs["files"] and outputs["modified_files"] for files
      matching these naming patterns.

traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

judges:
  - name: output_files_exist
    description: |
      Verify all three required output files are produced: HTML report,
      payload results YAML, and autodl JSON.
    check: |
      import os
      files = outputs.get("files", {})
      modified = outputs.get("modified_files", {})
      all_f = {**files, **modified}
      html = [k for k in all_f if k.endswith("-summary.html")]
      yaml_f = [k for k in all_f if os.path.basename(k).startswith("payload-results-") and k.endswith(".yaml")]
      json_f = [k for k in all_f if k.endswith("-autodl.json")]
      missing = []
      if not html:
          missing.append("HTML report (*-summary.html)")
      if not yaml_f:
          missing.append("payload results YAML (payload-results-*.yaml)")
      if not json_f:
          missing.append("autodl JSON (*-autodl.json)")
      if missing:
          return (False, f"Missing: {', '.join(missing)}")
      return (True, f"All 3 files found: {html[0]}, {yaml_f[0]}, {json_f[0]}")

  - name: yaml_results_valid
    description: |
      Verify the payload results YAML has the required schema: metadata block
      with payload_tag, version, stream, architecture; failing_jobs array;
      and candidates array with properly structured entries.
    check: |
      import yaml, os
      files = outputs.get("files", {})
      modified = outputs.get("modified_files", {})
      all_f = {**files, **modified}
      yaml_files = {k: v for k, v in all_f.items() if os.path.basename(k).startswith("payload-results-") and k.endswith(".yaml")}
      if not yaml_files:
          return (False, "No payload results YAML found")
      content = list(yaml_files.values())[0]
      try:
          data = yaml.safe_load(content)
      except Exception as e:
          return (False, f"Invalid YAML: {e}")
      if not isinstance(data, dict):
          return (False, "YAML root is not a dict")
      meta = data.get("metadata", {})
      required_meta = ["payload_tag", "version", "stream", "architecture"]
      missing = [f for f in required_meta if f not in meta]
      if missing:
          return (False, f"Missing metadata: {', '.join(missing)}")
      if "failing_jobs" not in data:
          return (False, "Missing failing_jobs array")
      if "candidates" not in data:
          return (False, "Missing candidates array")
      jobs = data.get("failing_jobs", [])
      cands = data.get("candidates", [])
      if jobs:
          required_job_fields = ["job_name", "failure_type", "root_cause_summary"]
          j0 = jobs[0]
          jmissing = [f for f in required_job_fields if f not in j0]
          if jmissing:
              return (False, f"failing_jobs[0] missing: {', '.join(jmissing)}")
      if cands:
          required_cand_fields = [
              "pr_url",
              "confidence_score",
              "revert_eligible",
              "revert_gates",
              "failing_jobs",
          ]
          c0 = cands[0]
          cmissing = [f for f in required_cand_fields if f not in c0]
          if cmissing:
              return (False, f"candidates[0] missing: {', '.join(cmissing)}")
          gate_names = {
              "changed_path_executed",
              "full_causal_chain",
              "exact_signature_timing",
              "alternatives_excluded",
              "experiment_isolates_change",
          }
          for index, candidate in enumerate(cands):
              gates = candidate.get("revert_gates")
              if not isinstance(candidate.get("revert_eligible"), bool):
                  return (False, f"candidates[{index}].revert_eligible must be boolean")
              if not isinstance(gates, dict) or set(gates) != gate_names:
                  return (False, f"candidates[{index}].revert_gates has wrong gate set")
              statuses = []
              for name in gate_names:
                  gate = gates[name]
                  if not isinstance(gate, dict):
                      return (False, f"candidates[{index}].revert_gates.{name} must be a mapping")
                  status = gate.get("status")
                  allowed = {"pass", "fail", "unknown"}
                  if name == "experiment_isolates_change":
                      allowed.add("not_applicable")
                  if status not in allowed:
                      return (False, f"candidates[{index}].revert_gates.{name} has invalid status")
                  if not isinstance(gate.get("evidence"), str) or not gate["evidence"].strip():
                      return (False, f"candidates[{index}].revert_gates.{name} lacks evidence")
                  statuses.append((name, status))
              expected_eligible = (
                  candidate.get("confidence_score", 0) >= 85
                  and all(
                      status == "pass"
                      for name, status in statuses
                      if name != "experiment_isolates_change"
                  )
                  and dict(statuses).get("experiment_isolates_change")
                  in {"pass", "not_applicable"}
              )
              if candidate["revert_eligible"] != expected_eligible:
                  return (False, f"candidates[{index}].revert_eligible is inconsistent with gates")
      return (True, f"Valid: {len(jobs)} failing jobs, {len(cands)} candidates")

  - name: json_data_valid
    description: |
      Verify the autodl JSON has the expected structure: table_name, schema dict,
      rows array with required fields, and all row values are strings.
    check: |
      import json
      files = outputs.get("files", {})
      modified = outputs.get("modified_files", {})
      all_f = {**files, **modified}
      json_files = {k: v for k, v in all_f.items() if k.endswith("-autodl.json")}
      if not json_files:
          return (False, "No autodl JSON found")
      content = list(json_files.values())[0]
      try:
          data = json.loads(content)
      except Exception as e:
          return (False, f"Invalid JSON: {e}")
      if not isinstance(data, dict):
          return (False, "JSON root is not a dict (expected object with table_name, schema, rows)")
      if "table_name" not in data:
          return (False, "Missing 'table_name' field")
      if "schema" not in data or not isinstance(data["schema"], dict):
          return (False, "Missing or invalid 'schema' field")
      rows = data.get("rows", [])
      if not isinstance(rows, list):
          return (False, "'rows' is not an array")
      if len(rows) == 0:
          return (False, "rows array is empty")
      required = ["payload_tag", "job_name", "failure_type", "root_cause_summary"]
      row = rows[0]
      missing = [f for f in required if f not in row]
      if missing:
          return (False, f"Missing fields in rows[0]: {', '.join(missing)}")
      non_string = [f for f in row if not isinstance(row[f], str)]
      if non_string:
          return (False, f"Non-string values in rows[0]: {', '.join(non_string)} (all values must be strings)")
      return (True, f"Valid JSON: {len(rows)} rows, table_name={data['table_name']}, all values are strings")

  - name: html_report_structure
    description: |
      Verify the HTML report contains required sections: executive summary,
      blocking jobs table, revert/no-revert verdict, embedded CSS, and
      per-job details.
    check: |
      files = outputs.get("files", {})
      modified = outputs.get("modified_files", {})
      all_f = {**files, **modified}
      html_files = {k: v for k, v in all_f.items() if k.endswith("-summary.html")}
      if not html_files:
          return (False, "No HTML report found")
      html = list(html_files.values())[0]
      checks = {
          "executive summary": "executive" in html.lower() or "summary" in html.lower(),
          "blocking jobs table": "<table" in html,
          "revert verdict": "revert" in html.lower() or "verdict" in html.lower(),
          "embedded CSS": "<style>" in html,
      }
      failed = [k for k, v in checks.items() if not v]
      if failed:
          return (False, f"Missing: {', '.join(failed)}")
      return (True, f"All {len(checks)} structural checks passed")

  - name: required_skill_invocations
    description: |
      Verify that payload-results-yaml and payload-autodl-json skills were
      invoked via the Skill tool during execution.
    check: |
      import json
      stdout = outputs.get("stdout", "")
      invoked = set()
      for line in stdout.splitlines():
          try:
              entry = json.loads(line)
          except (json.JSONDecodeError, ValueError):
              continue
          if entry.get("type") != "assistant":
              continue
          for block in entry.get("message", {}).get("content", []):
              if block.get("type") == "tool_use" and block.get("name") == "Skill":
                  skill = block.get("input", {}).get("skill", "")
                  invoked.add(skill)
      required = ["ci:payload-results-yaml", "ci:payload-autodl-json"]
      found = [s for s in required if s in invoked]
      missing = [s for s in required if s not in invoked]
      if missing:
          return (False, f"Missing Skill calls: {', '.join(missing)}. Found: {', '.join(found)}")
      return (True, f"Both required skills invoked: {', '.join(found)}")

  - name: source_use_advisory
    description: |
      Advisory source-use diagnostics. This check never fails the evaluation;
      consequential use of unavailable knowledge is judged semantically by
      point_in_time_integrity.
    check: |
      import json, re, urllib.parse, yaml
      from datetime import datetime, timezone

      stdout = outputs.get("stdout", "")
      violations = []
      shell_vars = {}

      case_data = outputs.get("annotations", {})

      def absolute_time(value):
          value = urllib.parse.unquote((value or "").strip().strip("\"'"))
          variable = re.fullmatch(r"\$(?:\{([A-Za-z_]\w*)\}|([A-Za-z_]\w*))", value)
          if variable:
              value = shell_vars.get(variable.group(1) or variable.group(2), "")
          if not value or value.lower() in {"now", "today", "yesterday", "tomorrow"}:
              return None
          try:
              if re.fullmatch(r"\d{4}-\d{2}-\d{2}", value):
                  return datetime.fromisoformat(value).replace(tzinfo=timezone.utc)
              parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              if parsed.tzinfo is None:
                  return None
              return parsed
          except ValueError:
              return None

      cutoff_text = (
          case_data.get("analysis_cutoff", "")
          if isinstance(case_data, dict)
          else ""
      )
      cutoff = absolute_time(cutoff_text)

      def remember_absolute_assignments(command):
          assignment = re.compile(
              r"(?:^|[\s;])([A-Za-z_]\w*)\s*=\s*"
              r"(?:\"([^\"]+)\"|'([^']+)'|([^\s;&|]+))"
          )
          for match in assignment.finditer(command):
              value = match.group(2) or match.group(3) or match.group(4)
              if absolute_time(value):
                  shell_vars[match.group(1)] = value

      def check_bound(value, context):
          parsed = absolute_time(value)
          if parsed is None:
              violations.append(
                  f"{context} uses a relative or unresolved cutoff: {value}"
              )
          elif cutoff is not None and parsed > cutoff:
              violations.append(
                  f"{context} exceeds analysis cutoff {cutoff_text}: {value}"
              )

      def is_github_url(value):
          try:
              host = (urllib.parse.urlsplit(value).hostname or "").lower()
          except ValueError:
              return False
          return host in {
              "github.com",
              "api.github.com",
              "raw.githubusercontent.com",
          }

      def is_immutable_github_url(value):
          try:
              parsed = urllib.parse.urlsplit(value)
          except ValueError:
              return False
          host = (parsed.hostname or "").lower()
          path = parsed.path
          sha = r"[0-9a-fA-F]{40}"
          if host == "api.github.com":
              if re.fullmatch(
                  rf"/repos/[^/]+/[^/]+/(?:git/)?commits/{sha}", path
              ):
                  return True
              if re.fullmatch(r"/repos/[^/]+/[^/]+/contents/.+", path):
                  ref = urllib.parse.parse_qs(parsed.query).get("ref", [""])[0]
                  return bool(re.fullmatch(sha, ref))
          if host == "raw.githubusercontent.com":
              return bool(re.fullmatch(rf"/[^/]+/[^/]+/{sha}/.+", path))
          if host == "github.com":
              return bool(
                  re.fullmatch(
                      rf"/[^/]+/[^/]+/(?:commit/{sha}(?:\.(?:diff|patch))?|"
                      rf"(?:blob|raw)/{sha}/.+)",
                      path,
                  )
              )
          return False

      def is_completed_agent_report(value):
          return (
              "claude-payload-agent" in value
              and "/artifacts/" in value
              and re.search(r"payload-analysis-.+-summary\.html(?:\?.*)?$", value)
          )

      def check_external_url(url, context):
          url = url.rstrip("),.;")
          if is_github_url(url) and not is_immutable_github_url(url):
              violations.append(f"{context} used mutable GitHub URL: {url}")
          if "claude-payload-agent" in url and not is_completed_agent_report(url):
              violations.append(
                  f"{context} used live/current Payload Agent URL: {url}"
              )

      for line in stdout.splitlines():
          try:
              entry = json.loads(line)
          except (json.JSONDecodeError, ValueError):
              continue
          if entry.get("type") != "assistant":
              continue
          for block in entry.get("message", {}).get("content", []):
              if block.get("type") != "tool_use":
                  continue
              name = block.get("name", "")
              tool_input = block.get("input", {})

              if name == "Read":
                  path = tool_input.get("file_path", "")
                  if (
                      path.endswith("annotations.yaml")
                      or "/evals/cases/payload-analysis/README.md" in path
                      or path.endswith("/comments.json")
                  ):
                      violations.append(f"Read evaluation/future-leaking file: {path}")

              if name == "WebFetch":
                  url = tool_input.get("url", "")
                  check_external_url(url, "WebFetch")

              if name != "Bash":
                  continue
              command = tool_input.get("command", "")
              remember_absolute_assignments(command)
              if re.search(
                  r"(?:annotations\.yaml|evals/cases/payload-analysis/README\.md|"
                  r"/comments\.json)",
                  command,
                  re.I,
              ):
                  violations.append("Bash read evaluation/future-leaking data")

              mutable_gh = (
                  r"\bgh\s+pr\s+(?:view|list|status|checks|diff)\b",
                  r"\bgh\s+search\b",
                  r"\bgh\s+api\s+graphql\b",
                  r"\bgh\s+api\b[^\n]*(?:/pulls|/issues|/comments|/reviews)",
                  r"\bgit\s+fetch\b[^\n]*(?:refs/)?pull/",
              )
              if any(re.search(pattern, command, re.I) for pattern in mutable_gh):
                  violations.append(f"Unbounded mutable GitHub lookup: {command[:180]}")

              for url in re.findall(r"https?://[^\s'\"<>]+", command, re.I):
                  check_external_url(url, "Bash")

              git_log_pattern = (
                  r"\bgit(?:\s+-C\s+(?:\"[^\"]*\"|'[^']*'|\S+))?"
                  r"\s+log\b[^\n;&|]*"
              )
              for match in re.finditer(git_log_pattern, command, re.I):
                  invocation = match.group(0)
                  bounds = list(
                      re.finditer(
                          r"--(?:until|before)(?:=|\s+)"
                          r"(?P<value>\"[^\"]+\"|'[^']+'|[^\s;&|]+)",
                          invocation,
                          re.I,
                      )
                  )
                  if not bounds:
                      violations.append(
                          f"Git history lookup lacks a cutoff: {invocation[:180]}"
                      )
                  for bound in bounds:
                      check_bound(bound.group("value"), "Git history lookup")

              for api_call in re.finditer(
                  r"\bgh\s+api\b[^\n;|]*?/commits(?:\?|[\"'\s]|$)[^\n;|]*",
                  command,
                  re.I,
              ):
                  invocation = api_call.group(0)
                  if re.search(
                      r"/commits/[0-9a-f]{40}(?:[\"'\s]|$)",
                      invocation,
                      re.I,
                  ):
                      continue
                  bounds = re.findall(
                      r"(?:[?&]|\\u0026)until=([^&\s'\"\\]+)",
                      invocation,
                      re.I,
                  )
                  if not bounds:
                      violations.append(
                          f"GitHub commit search lacks an until cutoff: "
                          f"{invocation[:180]}"
                      )
                  for bound in bounds:
                      check_bound(bound, "GitHub commit search")

      if violations:
          unique = list(dict.fromkeys(violations))
          return (True, "Advisory only: " + "; ".join(unique[:8]))
      return (True, "No source-use advisories")

  - name: case_constraints
    description: |
      Machine-check expected candidates, forbidden high-confidence revert
      recommendations, and required causal findings from case annotations.
    check: |
      import os, yaml

      case_data = outputs.get("annotations", {})
      if not isinstance(case_data, dict):
          return (False, "Case annotations are unavailable to deterministic judge")

      all_files = {
          **outputs.get("files", {}),
          **outputs.get("modified_files", {}),
      }
      result_files = {
          path: content for path, content in all_files.items()
          if os.path.basename(path).startswith("payload-results-")
          and path.endswith(".yaml")
      }
      if not result_files:
          return (False, "No payload results YAML found")
      try:
          result = yaml.safe_load(next(iter(result_files.values()))) or {}
      except yaml.YAMLError as exc:
          return (False, f"Invalid payload results YAML: {exc}")

      candidates = result.get("candidates", []) or []
      by_url = {
          str(candidate.get("pr_url", "")).rstrip("/").lower(): candidate
          for candidate in candidates
          if isinstance(candidate, dict)
      }
      failures = []

      expected_causes = (
          (case_data.get("expected_candidates", []) or [])
          + (case_data.get("expected_ci_config_issues", []) or [])
      )
      expected_actionable = []
      for expected in expected_causes:
          url = str(expected.get("pr_url", "")).rstrip("/").lower()
          candidate = by_url.get(url)
          if candidate is None:
              failures.append(f"Missing expected candidate {url}")
              continue
          minimum = int(expected.get("min_confidence", 0))
          actual = int(candidate.get("confidence_score", 0))
          if actual < minimum:
              failures.append(
                  f"Expected candidate {url} scored {actual}, below {minimum}"
              )
          expected_confidence = int(
              expected.get("expected_confidence", minimum)
          )
          if expected_confidence >= 85:
              expected_actionable.append((url, candidate))

      if case_data.get("has_revert_candidates") is True:
          if not expected_actionable:
              failures.append(
                  "Case expects a revert candidate but defines no expected "
                  "cause at or above the revert threshold"
              )
          for url, candidate in expected_actionable:
              if candidate.get("revert_eligible") is not True:
                  failures.append(
                      f"Expected actionable candidate {url} was not marked "
                      "revert_eligible"
                  )

      for url in case_data.get("forbidden_revert_candidates", []) or []:
          normalized = str(url).rstrip("/").lower()
          candidate = by_url.get(normalized)
          if candidate is None:
              continue
          confidence = int(candidate.get("confidence_score", 0))
          eligible = candidate.get("revert_eligible") is True
          if confidence >= 85 or eligible:
              failures.append(
                  f"Forbidden revert candidate {normalized} remained actionable "
                  f"(confidence={confidence}, revert_eligible={eligible})"
              )

      generated = {
          path: content for path, content in all_files.items()
          if path.endswith("-summary.html")
          or (
              os.path.basename(path).startswith("payload-results-")
              and path.endswith(".yaml")
          )
          or path.endswith("-autodl.json")
      }
      searchable = "\n".join(str(content) for content in generated.values()).lower()
      for claim in case_data.get("required_claims", []) or []:
          alternatives = [
              str(value).lower()
              for value in claim.get("any_of", [])
              if value
          ]
          if alternatives and not any(value in searchable for value in alternatives):
              failures.append(
                  f"Missing required causal claim: {claim.get('name')}"
              )

      if failures:
          return (False, "; ".join(failures))
      return (
          True,
          "Expected, forbidden, and required causal constraints satisfied",
      )

  - name: analysis_quality
    description: |
      LLM judge to assess root cause analysis depth, PR correlation accuracy,
      and overall report quality. Uses only YAML results and HTML report, not
      the full output tree (which includes the snapshot and exceeds context).
    prompt: |
      You are evaluating the output of an OCP payload analysis skill. The skill
      analyzes failed blocking jobs in an OpenShift CI payload using a local
      snapshot, traces root causes by examining Prow job logs and artifacts,
      correlates failures with candidate PRs using a weighted scoring rubric,
      and produces a comprehensive HTML report with revert recommendations.

      Review the skill's YAML results file:

      {% for path, content in outputs.files.items() if path.endswith('.yaml') and 'payload-results' in path %}
      ### {{ path }}

      {{ content }}
      {% endfor %}

      Review the skill's HTML report:

      {% for path, content in outputs.files.items() if path.endswith('-summary.html') %}
      ### {{ path }}

      {{ content }}
      {% endfor %}

      Expected outcomes for this test case:

      {{ annotations }}

      Evaluate the YAML results file and HTML report on a 1-5 scale:

      Score 1: Analysis is missing or completely wrong — no root causes identified,
               no PR correlation, report is empty or broken.
      Score 2: Superficial analysis — root causes restate symptoms without explanation
               (e.g., "node not ready" without tracing WHY), PR correlations are
               absent or random, report structure is incomplete.
      Score 3: Adequate analysis — root causes go one level deeper than symptoms,
               some PR correlations are plausible, report has required sections
               but may have gaps in coverage or depth.
      Score 4: Good analysis — root causes cite specific error messages from logs,
               PR correlations reference actual code/components changed, revert
               recommendations have clear rationale, report is well-structured.
      Score 5: Excellent analysis — root causes traced to specific code paths with
               log excerpts, PR correlations demonstrate causal reasoning (not just
               temporal coincidence), rubric scores are itemized, report is
               comprehensive and immediately actionable.

      Key evaluation criteria:
      - Does the number of failing jobs approximately match expected_failed_job_count?
      - Are the root cause summaries specific (citing error messages, code paths)
        rather than generic (just restating test names)?
      - If expected_candidates are listed in annotations, are they identified with
        evidence-based rationale?
      - If expected_ci_config_issues are listed, are those out-of-payload CI
        changes identified as structured causal candidates and tied to the
        expected jobs?
      - Are every required_claim and discriminating signal established from
        evidence, and are must_not_conclude claims avoided?
      - Does the HTML report contain actionable information?

  - name: revert_scoring_accuracy
    description: |
      LLM judge to assess whether the confidence scoring rubric was correctly
      applied and expected revert candidates identified. Uses only YAML results
      and autodl JSON, not the full output tree.
    prompt: |
      You are evaluating whether the payload analysis skill correctly identified
      revert candidates and applied its confidence scoring rubric.

      First compute the raw rubric score:
      - New failure mode: +30 only when the minimal causal signature has a
        verified boundary in raw artifacts and is plausibly attributable to
        changed code.
      - Component exclusivity: +30 for the sole modifier of the affected
        component, +20 for 2-3 modifiers, or +10 for 4+ modifiers. The sole
        modifier tier already covers the single-candidate signal.
      - Error message match: +40 for a direct string, symbol, function, or
        identifier match; +20-30 for the same executed code path; or +10 for
        the same subsystem only.
      - Multi-job correlation: +10 for independent executions with the same
        causal signature.
      - Presubmit coverage gap: +10 when the failing scenario is not covered.
      The raw maximum is 120 and is capped at 100.

      Some treatment outputs additionally cap final confidence by causal
      evidence: 100 for an executed end-to-end mechanism with alternatives
      excluded, 80 for an incomplete mechanism, 60 for contextual correlation
      only, and 20 when contradicted. When the output records such a cap,
      verify that final confidence is the lower of the capped raw score and
      causal-evidence cap. When it records `revert_gates`, verify that
      `revert_eligible` is true only at confidence >= 85 with the four core
      gates passing and the experiment gate passing or not applicable. Do not
      penalize a control output solely because it uses the legacy schema
      without causal-cap or revert-gate fields.

      Review the YAML results file:

      {% for path, content in outputs.files.items() if path.endswith('.yaml') and 'payload-results' in path %}
      ### {{ path }}

      {{ content }}
      {% endfor %}

      Review the autodl JSON file:

      {% for path, content in outputs.files.items() if path.endswith('-autodl.json') %}
      ### {{ path }}

      {{ content }}
      {% endfor %}

      Expected outcomes for this test case:

      {{ annotations }}

      If expected_candidates or expected_ci_config_issues are listed in
      annotations, those PRs should be identified with confidence >=
      min_confidence and linked to the expected_failing_jobs. A CI-configuration
      cause belongs in structured candidates even though it is outside the
      payload changelog. If both lists are empty, no false positive revert
      recommendations should appear. Any forbidden_revert_candidates must
      remain below revert confidence and must not be marked revert-eligible.

      Evaluate on a 1-5 scale:

      Score 1: No scoring applied, or scores are arbitrary. Expected revert
               candidates (from annotations) are completely missed.
      Score 2: Some expected candidates identified but confidence scores are way
               off (>20 points from expected) or key failing job linkages are
               missing.
      Score 3: All expected high-confidence candidates (min_confidence >= 85) are
               identified above threshold, but scores may be off by 10-20 points
               or rubric components not itemized.
      Score 4: All expected candidates identified with scores within 10 points of
               expected_confidence. Rubric correctly applied with itemized
               breakdown. Most expected failing jobs correctly linked.
               Infrastructure failures correctly distinguished from product
               failures.
      Score 5: All expected candidates identified with scores within 5 points of
               expected_confidence. Rubric meticulously applied — each component
               score justified with specific evidence. All expected failing jobs
               correctly linked. No false positive revert recommendations for
               unrelated PRs. Cross-job correlation signal clearly documented.

  - name: point_in_time_integrity
    description: |
      LLM judge assessing only whether unavailable future knowledge influenced
      a causal, confidence, or revert decision.
    prompt: |
      Evaluate one question only:

      **Did the agent use knowledge unavailable at payload completion to
      determine cause, confidence, or revert eligibility?**

      Review the YAML results:

      {% for path, content in outputs.files.items() if path.endswith('.yaml') and 'payload-results' in path %}
      ### {{ path }}

      {{ content }}
      {% endfor %}

      Review the HTML report:

      {% for path, content in outputs.files.items() if path.endswith('-summary.html') %}
      ### {{ path }}

      {{ content }}
      {% endfor %}

      Case metadata and exact cutoff:

      {{ annotations }}

      Future knowledge includes:
      - a later revert, its merge, or its experimental CI results;
      - subsequent payload pass/fail outcomes;
      - GitHub comments, reviews, status changes, or incident conclusions;
      - present-day PR state or reasoning that a PR must be innocent because it
        still has not been reverted;
      - a previous payload-agent analysis generated after the cutoff.

      Mere access is not failure. Do not penalize mutable or unpinned URLs,
      current branches, undated evidence, broad searches, or weak provenance.
      Do not fail because unavailable information was visible but did not
      influence cause, confidence, or revert eligibility. The report generation
      timestamp is irrelevant.

      Require a consequential connection between the unavailable fact and a
      decision. If the same conclusion is independently established from job
      artifacts, diffs, and causal ordering, later confirmation is harmless
      unless the analysis relies on it.

      Evaluate on a 1-5 scale:

      Score 1: A central diagnosis or revert decision explicitly depends on
               unavailable knowledge.
      Score 2: Unavailable knowledge materially influences a decision, although
               other evidence is present.
      Score 3: The analysis appears to use unavailable knowledge, but its effect
               on a decision cannot be determined.
      Score 4: No consequential use of unavailable knowledge is found.
      Score 5: The evidence clearly shows every material decision stands without
               unavailable knowledge.

thresholds:
  output_files_exist:
    min_pass_rate: 1.0
  yaml_results_valid:
    min_pass_rate: 1.0
  json_data_valid:
    min_pass_rate: 1.0
  html_report_structure:
    min_pass_rate: 1.0
  analysis_quality:
    min_mean: 3.5
  revert_scoring_accuracy:
    min_mean: 3.0
  case_constraints:
    min_pass_rate: 1.0
  point_in_time_integrity:
    min_mean: 4.0
  required_skill_invocations:
    min_pass_rate: 1.0
