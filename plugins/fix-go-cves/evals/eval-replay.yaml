extends: replay-base.yaml

judges:
  - name: backport
    description: Identify the existing default-branch fix and recommend a usable backport.
    feedback_type: bool
    samples: 3
    prompt: |
      Evaluate only the backport criterion in the authoritative annotations.
      Accept equivalent wording and evidence. Do not add requirements about
      wording, formatting, or whether the Go directive raise needs approval.

      Annotations:
      {{ annotations }}

      Final reply:
      {{ outputs.files['output/reply.md'] }}

  - name: action_owner
    description: Give the flagged failure a supported action and an owner.
    feedback_type: bool
    samples: 3
    prompt: |
      Evaluate only the action_owner criterion in the authoritative annotations.
      Accept equivalent wording and evidence. Do not require a team decision
      about the Go directive raise, and do not penalize a supported caveat about it.
      Assess claims throughout the reply, including its overview and conclusion.
      A later uncertainty caveat does not excuse an unsupported categorical claim.
      Every substantive requirement in this criterion must be satisfied. An
      omitted requirement fails; do not award a pass for meeting most of them
      or infer an unstated prerequisite. The rerun advice must unambiguously
      establish that the repair reaches the remote target branch before rerunning;
      a backport confined to a local or generated fix branch is insufficient.

      Annotations:
      {{ annotations }}

      Final reply:
      {{ outputs.files['output/reply.md'] }}

thresholds:
  backport:
    min_pass_rate: 1.0
    max_error_rate: 0
  action_owner:
    min_pass_rate: 1.0
    max_error_rate: 0
