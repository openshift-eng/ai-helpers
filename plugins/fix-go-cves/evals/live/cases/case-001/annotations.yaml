criteria:
  outcome: 'Accurately reports every past/present factual claim anywhere in the reply against
    captured evidence, including the executed builder identity and scan coverage. Any contradicted
    factual claim fails this criterion even when the Summary and most core facts are correct;
    a contradiction is not partial credit or a minor exception. Native coverage is specific
    to named artifacts and phases: unknown coverage of other binaries does not negate positive
    proof for those artifacts.
    Reports the actual script exit and retained branch/commits consistently with runtime evidence.
    Distinguishes fixed, ignored and remaining findings, and unconfirmed scan coverage. Does
    not call a partial or unverified run clean, claim a build/test passed when it failed, or
    invent a PR command. No particular vulnerability, dependency version or number of fixes
    is required.'
  report_scope: >-
    Delivers the complete authenticated LOG and original engine exit through native
    output; required observations belong in that accessible record, without model copying.
    Retain all earlier visible assistant text for factual review. Adds no diagnosis,
    repair advice or predicted results; unsupported claims and extra publication steps
    still fail. Raw producer diagnostics are preserved evidence, not new assistant claims.
    Missing native proof stays unverified. Historical frozen contracts remain unchanged.
