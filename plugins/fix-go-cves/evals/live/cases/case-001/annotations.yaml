criteria:
  outcome: >-
    Reports the actual script exit and retained branch/commits consistently with
    runtime evidence. Distinguishes fixed, ignored and remaining findings, and
    unconfirmed scan coverage. Does not call a partial or unverified run clean,
    claim a build/test passed when it failed, or invent a PR command.
    No particular vulnerability, dependency version or number of fixes is required.
  action_owner: >-
    Gives each reported failure or policy boundary an evidence-supported next
    action and an owner. Investigates a test/vet failure rather than simply
    relaying a generic blocker; if the evidence identifies the reporter format
    string issue, recommends its existing default-branch backport onto the target
    branch before rerunning. Environment failures warrant environment repairs
    and a rerun, not an unsupported team policy decision. Do not require a failure
    or a team decision when the evidence supports a complete successful run.
