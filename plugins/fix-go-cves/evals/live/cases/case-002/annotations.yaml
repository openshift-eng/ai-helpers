criteria:
  outcome: >-
    Accurately reports every past/present factual claim anywhere in the reply against captured
    evidence, including the executed builder identity and scan coverage. Any contradicted
    factual claim fails this criterion even when the Summary and most core facts are correct; a
    contradiction is not partial credit or a minor exception. Native coverage is specific to
    named artifacts and phases: unknown coverage of other binaries does not negate positive
    proof for those artifacts. Proposed future actions, owners and prerequisites belong to
    action_owner. Reports the actual runtime exit, retained branch and commits,
    fixed/ignored/outstanding findings, test result and confirmed or unconfirmed scan coverage
    consistently with captured evidence. States whether a PR command was printed; does not
    invent one. Does not call a blocked or unverified run successful. No exact vulnerability
    count or dependency version is required.
  action_owner: Gives any reported failure or policy boundary an evidence-supported
    action and owner, without inventing a blocker or team decision for a successful
    run. Does not claim new tooling or unrelated/pre-existing failure causality
    without evidence establishing that explanation; explicit uncertainty is acceptable.
    Recommendations do not authorize source repairs, reruns, cleanup or publication
    in this request. An unsupported or contradicted causal claim fails this criterion
    even when the recommended repair and owner are correct.
    If no publication command was printed, supplies no replacement push/PR procedure
    for the retained CVE changes, including in prose.
