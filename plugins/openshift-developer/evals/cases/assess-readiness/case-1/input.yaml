  # Feature 1: Fully ready — all checks should pass
  - key: "OCPSTRAT-3444"
    summary: "Enhanced Pod Security Admission"
    priority: "Major"
    status: "In Progress"
    description: |
      h3. *Feature Overview*
      Enhanced Pod Security Admission provides improved security defaults for workloads
      running on OpenShift clusters, ensuring compliance with industry standards.

      h3. *Goals*
      - Enforce baseline security profiles by default
      - Provide clear upgrade path from legacy SCCs
      - Minimize disruption to existing workloads

      h3. *Requirements*
      h4. Functional Requirements
      - PSA labels applied to all new namespaces
      - Warnings emitted for non-compliant pods

      h4. Testing and Validation Requirements
      - Validate upgrade and rollback behavior
      - Verify PSA label enforcement on new namespaces
      - Integration tests for SCC-to-PSA migration

      h4. Non-Functional Requirements
      - No measurable performance regression on pod admission latency

      h4. Operational Requirements
      - Metrics exposed for policy violations
      - Alert for misconfigured namespace labels

      h3. *Use Cases*
      - Cluster administrator enables restricted profile for production namespace
      - Developer deploys workload and receives actionable warning

      h3. *Deployment Considerations*
      | Topology | Applicable |
      | Self-managed, classic, multi-node | Yes |
      | Managed, HCP | Yes |
      | SNO | Yes |
      | Restricted network | Yes |

      h3. *Interoperability Considerations*
      - Must coexist with NetworkPolicy enforcement
      - Compatible with OPA Gatekeeper

      h3. *Customer Considerations*
      - Migration guide required for customers using legacy SCCs

      h2. *Quality Status*
      | Metric | Value |
      | Estimated number of e2e/integration tests | 14 |
      | % tests automated | 80% |
    remote_links:
      - title: "Test Plan — Pod Security Admission"
        url: "https://docs.google.com/document/d/test-plan-psa"
      - title: "Enhancement Proposal"
        url: "https://github.com/openshift/enhancements/pull/1234"
      - title: "PR: PSA label enforcement"
        url: "https://github.com/openshift/kubernetes/pull/5001"
      - title: "PR: SCC migration tests"
        url: "https://github.com/openshift/origin/pull/28100"
      - title: "Documentation — PSA Migration Guide"
        url: "https://docs.openshift.com/container-platform/latest/security/psa.html"
    subtasks:
