pr_url: https://github.com/openshift/hypershift/pull/9818
expected_tier: critical
acceptable_tiers: [critical]
# In the root AGENTS.md at base_sha, in none of the nested ones.
agents_md_marker: "## Fleet-Wide Rollout Impact"
ground_truth: >
  Critical. Re-lands a reverted change to NodePool rollout control in the
  HyperShift operator: new rollout hashes decide when machines are replaced, a
  state machine chooses the effective hash for the token and user-data secrets
  new machines join with, the secret janitor and CAPI propagation are gated on
  it, and a migration seeds rollout annotations on every existing NodePool. The
  NodePool controller runs in the HO, so every NodePool on a management cluster
  receives the change at once when the HO is upgraded. A defect replaces every
  machine of every NodePool or strands new machines (the reverted version
  caused token desynchronization and ignition failures). The diff is not
  readable in full (two large test patches are omitted), which adds
  uncertainty.
