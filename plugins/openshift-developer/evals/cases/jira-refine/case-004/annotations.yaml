  - https://github.com/openshift/cluster-version-operator/blob/6ac86dc99c02366314381b720ab1d4a38d38f1c2/pkg/cvo/availableupdates.go
  - https://github.com/openshift/cluster-version-operator/blob/6ac86dc99c02366314381b720ab1d4a38d38f1c2/pkg/cincinnati/cincinnati.go
  - https://github.com/openshift/hypershift/blob/41cbcdfa522b70a29fcc10a5036f17760652aedf/control-plane-operator/controllers/hostedcontrolplane/v2/cvo/deployment.go
  - https://github.com/openshift/cluster-version-operator/pull/1438
  - https://github.com/openshift/cluster-version-operator/pull/1357
notes: |
  The fixture preserves the reporter's proposed HyperShift-only fix and the
  maintainer's environment-injection suggestion, without adding the transport
  diagnosis. People are anonymized. The related guest-proxy-isolation issues
  are available through the stub as context. The report is recent, so it
  cannot be closed as stale. The customer-portal article may require access;
  public source and release metadata suffice to investigate the defect.

  The case's optional research guard blocks the ai-helpers repository and
  GitHub searches for this issue key, preventing its published expected answer
  from becoming research input. It permits the cited source and original CVO
  PRs. Revisit the case if coordinated fixes ship: current branch contents are
  not a substitute for the pinned 4.22.9 payload evidence.
