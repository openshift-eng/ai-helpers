name: pr-risk-assessment-eval
description: >
  Evaluate pr-risk-assessment tiers on real OpenShift pull requests. Each case
  freezes the evidence an automated caller hands the skill (title, description,
  and changed files with patches) in input.json. The run may read the
  repository's source at the pull request's base commit, but never the pull
  request itself: its labels and comments would reveal the answer. Judges check
  the tier, that the run read the repository's AGENTS.md, that no pull request
  read reached GitHub, and the reason.

execution:
  mode: case
  skill: openshift-developer:pr-risk-assessment
  arguments: "{pr_url}"
  timeout: 2400
  max_budget_usd: 20.0
  parallelism: 6

runner:
  type: claude-code
  effort: high
  plugin_dirs:
    - plugins/openshift-developer
  settings:
    hooks:
      # stubs/pr_evidence_guard.py, staged next to input.json: blocks reads of
      # pull requests, issues, searches, this repository's eval answers, and
      # the target repository at any commit but base_sha. Exit code 2 denies
      # the tool call and returns the reason to the model.
      PreToolUse:
        - matcher: "Bash|WebFetch|Read|Grep|Glob"
          hooks:
            - type: command
              command: python3 "$CLAUDE_PROJECT_DIR/pr_evidence_guard.py"
  system_prompt: |
    You are running a configured, unattended pr-risk-assessment evaluation job.

    input.json in the current directory holds the frozen evidence for the pull
    request: repo, pr_number, pr_url, base_branch, base_sha, head_sha, title,
    body, files (filename, status, additions, deletions, kind, and patch, or
    patch_omitted with why), files_listed, and diff_complete. It is the evidence
    your caller supplied: use it instead of fetching the pull request. Never
    read the pull request from GitHub (its page, API objects, labels, comments,
    reviews, or search results); such reads are blocked.

    You may read the repository at base_sha, which is on base_branch, with a
    shallow, sparse clone under .work/:

      mkdir -p .work && git init -q .work/repo && cd .work/repo
      git remote add origin https://github.com/<repo>.git
      git sparse-checkout set --no-cone '/*' '!/vendor/' '!**/testdata/'
      git fetch -q --depth 1 --filter=blob:none origin <base_sha>
      git checkout -q FETCH_HEAD

    then `git show <base_sha>:<path>` for files outside the sparse checkout,
    or read single files with the GitHub contents API at ref=base_sha. Reads
    at any other commit or branch, including the pull request's head, are
    blocked.

    When the skill finishes, write output/risk-result.json with the Write tool
    (valid JSON, no code fences) with these fields:
    - pr_url: string
    - tier: low | moderate | critical
    - reason: the skill's reason paragraph
    - deciding_facts: list of the facts that decided the tier
    - guidance_read: list of the repository files you read for risk-assessment
      specifics (AGENTS.md and any files it links), as repository paths

models:
  skill: claude-opus-5-5
  judge: runner:/claude-opus-5-5

permissions:
  allow:
    - "Skill"
    - "Bash"
    - "Read"
    - "Write"
    - "Glob"
    - "Grep"
    - "Agent"
  deny:
    - "mcp__*"
    - "WebFetch"
    - "WebSearch"

mlflow:
  experiment: pr-risk-assessment-eval

dataset:
  path: cases/pr-risk-assessment
  workspace:
    files:
      - dest: pr_evidence_guard.py
        source: plugins/openshift-developer/evals/stubs/pr_evidence_guard.py
  schema: |
    Each case directory contains:
    - input.json: the frozen evidence for one pull request, made with
      scripts/snapshot_pr_evidence.py: repo, pr_number, pr_url, base_branch,
      base_sha, head_sha, title, body, files with patches, files_listed,
      diff_complete. Labels, comments, and the author are left out, and
      people's names are removed.
    - annotations.yaml: expected outcome and ground truth for judges:
      - 'expected_tier' and 'acceptable_tiers'
      - 'agents_md_marker': a line only the repository's root AGENTS.md at
        base_sha contains, which a run that read that file has in a tool
        output
      - 'ground_truth': the verified analysis the LLM judge compares against

outputs:
  - path: "output"
    schema: |
      risk-result.json — the run summary requested by the system prompt

traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

judges:
  # ── Deterministic judges ──

  - name: result_json_valid
    description: Verify output/risk-result.json is valid and complete
    check: |
      import json
      files = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      found = [v for k, v in files.items() if k.endswith("risk-result.json")]
      if not found:
          return (False, "No risk-result.json found")
      try:
          data = json.loads(found[0])
      except Exception as e:
          return (False, f"Invalid JSON: {e}")
      required = ["pr_url", "tier", "reason", "deciding_facts", "guidance_read"]
      missing = [f for f in required if f not in data]
      if missing:
          return (False, f"Missing fields: {', '.join(missing)}")
      if data["tier"] not in ("low", "moderate", "critical"):
          return (False, f"Unknown tier {data['tier']!r}")
      if not isinstance(data["reason"], str) or len(data["reason"].strip()) < 80:
          return (False, "The reason is missing or too short to audit")
      return (True, f"Valid result: {data['tier']}")

  - name: tier_correct
    description: Verify the tier matches the expected or an acceptable one
    check: |
      import json
      ann = outputs.get("annotations", {})
      files = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      found = [v for k, v in files.items() if k.endswith("risk-result.json")]
      if not found:
          return (False, "No risk-result.json found")
      try:
          got = str(json.loads(found[0]).get("tier", "")).lower()
      except Exception as e:
          return (False, f"Invalid JSON: {e}")
      expected = ann.get("expected_tier")
      acceptable = ann.get("acceptable_tiers", [expected])
      if got in acceptable:
          return (True, f"tier={got} (expected {expected})")
      return (False, f"tier={got}, expected one of {acceptable}")

  - name: agents_md_read
    description: >
      Verify the run read the repository's root AGENTS.md, as the skill
      directs: a tool output holds the case's agents_md_marker, whatever the
      tool, working directory, or exit status (base_sha is the guard's job)
    check: |
      import json
      marker = outputs.get("annotations", {}).get("agents_md_marker")
      if not marker:
          return (False, "annotations.yaml sets no agents_md_marker")
      def text(e):
          c = e.get("content")
          return c if isinstance(c, str) else json.dumps(c)
      hits = [e for e in outputs.get("events", [])
              if e.get("type") == "tool_result" and marker in text(e)]
      if not hits:
          return (False, f"No tool output holds {marker!r} from the root AGENTS.md")
      return (True, f"Read the root AGENTS.md ({len(hits)} output(s))")

  - name: pull_request_not_read
    description: >
      Verify no tool call reached the pull request, its labels, comments,
      searches, or the repository beyond base_sha (the hook's policy, applied
      again to every call it let through), and no tool output carried a
      risk-tier label or this eval's answers, however it was read
    module: plugins.openshift-developer.evals.stubs.pr_evidence_guard
    function: judge_pull_request_not_read

  # ── LLM judges ──

  - name: reason_quality
    description: Does the reason name the runtime change and the blast radius that decide the tier?
    score_range: [1, 5]
    prompt: |
      You are grading a pull request risk assessment against verified ground
      truth. The tiers mean: Low, no product behaviour change; Moderate, might
      impact product behaviour, but not disruptively; Critical, impacts product
      behaviour and could be disruptive if wrong.

      Run result (risk-result.json):
      {% for path, content in outputs.files.items() if path.endswith('risk-result.json') %}
      {{ content }}
      {% endfor %}

      Expected outcome and ground truth:

      {{ annotations }}

      Score 1-5:

      Score 1: Wrong tier, or the reason misstates what the change does.
      Score 2: Right tier, but for reasons that miss the mechanism the ground
               truth names as deciding.
      Score 3: Right tier and roughly the right mechanism, but vague about who
               receives the change, or with a factual error.
      Score 4: Right tier; names the deciding mechanism, who receives the change
               and when, and the blast radius; no factual errors.
      Score 5: Everything in 4, concise and auditable by a reviewer, and states
               what could not be determined where that mattered.

thresholds:
  result_json_valid:
    min_pass_rate: 1.0
  tier_correct:
    min_pass_rate: 1.0
  agents_md_read:
    min_pass_rate: 1.0
  pull_request_not_read:
    min_pass_rate: 1.0
  reason_quality:
    min_mean: 3.5
