name: pr-risk-assessment-eval
description: >
  Evaluate pr-risk-assessment tiers on real OpenShift pull requests. Each case
  freezes the evidence an automated caller hands the skill (title, description,
  and changed files with patches) in input.json. The run may read the
  repository's source at the pull request's base commit, but never the pull
  request itself: its labels and comments would reveal the answer. Judges check
  the tier, that the run read the repository guidance it needed (progressive
  disclosure), that no pull request read reached GitHub, and the reason.

execution:
  mode: case
  skill: openshift-developer:pr-risk-assessment
  arguments: "input.json"
  timeout: 2400
  max_budget_usd: 20.0
  parallelism: 6

runner:
  type: claude-code
  effort: high
  plugin_dirs:
    - plugins/openshift-developer
  settings:
    hooks:
      # Blocks reads of pull requests, issues, repository events, searches, and
      # this repository's eval answers. Exit code 2 denies the tool call and
      # returns the message to the model.
      PreToolUse:
        - matcher: "Bash|WebFetch|Read|Grep|Glob"
          hooks:
            - type: command
              command: >-
                python3 -c "import json,re,sys;
                t=json.dumps(json.load(sys.stdin).get('tool_input') or {});
                p=r'repos/[^/ ]+/[^/ ]+/(pulls|issues|events)\b|github[.]com/[^/ ]+/[^/ ]+/(pull|pulls|issues)/|commits/[0-9a-f]+/pulls|\bgh +(pr|issue|search)\b|search/(issues|code|commits)\b|graphql|/evals/';
                hit=re.search(p, t);
                hit and sys.stderr.write('Blocked by the eval harness: the pull request is frozen in input.json. Read source at base_sha with git or the contents API.');
                sys.exit(2 if hit else 0)"
  system_prompt: |
    You are running a configured, unattended pr-risk-assessment evaluation job.

    input.json in the current directory holds the frozen evidence for one pull
    request, in the evidence file format the skill's references/evidence.md
    describes. It is the evidence your caller supplied: use it as given. Never
    read the pull request from GitHub (its page, API objects, labels, comments,
    reviews, or search results); such reads are blocked.

    You may read the repository's source at base_sha: make the shallow, sparse
    clone under .work/ that references/evidence.md shows, or read single files
    with the GitHub contents API at ref=base_sha. Do not fetch other commits.

    When the skill finishes, write output/risk-result.json (valid JSON, no code
    fences) with these fields:
    - pr_url: string
    - tier: low | moderate | critical
    - reason: the skill's reason paragraph
    - deciding_facts: list of the facts that decided the tier
    - guidance_read: list of the repository guidance files you read, as paths
      relative to the skill directory (empty when none applied)

models:
  skill: claude-opus-5-5
  judge: runner:/claude-opus-5-5

permissions:
  allow:
    - "Skill"
    - "Bash"
    - "Read"
    - "Write"
    - "Glob"
    - "Grep"
    - "Agent"
  deny:
    - "mcp__*"
    - "WebFetch"
    - "WebSearch"

mlflow:
  experiment: pr-risk-assessment-eval

dataset:
  path: cases/pr-risk-assessment
  schema: |
    Each case directory contains:
    - input.json: the frozen evidence for one pull request, made with
      scripts/snapshot_pr_evidence.py (see the skill's references/evidence.md):
      repo, pr_number, pr_url, base_branch, base_sha, head_sha, title, body,
      files with patches, files_listed, diff_complete. Labels, comments, and
      the author are left out, and people's names are removed.
    - annotations.yaml: expected outcome and ground truth for judges:
      - 'expected_tier' and 'acceptable_tiers'
      - 'guidance': repository guidance files the run must read, as paths
        relative to the skill directory
      - 'ground_truth': the verified analysis the LLM judge compares against

outputs:
  - path: "output"
    schema: |
      risk-result.json — the run summary requested by the system prompt

traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

judges:
  # ── Deterministic judges ──

  - name: result_json_valid
    description: Verify output/risk-result.json is valid and complete
    check: |
      import json
      files = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      found = [v for k, v in files.items() if k.endswith("risk-result.json")]
      if not found:
          return (False, "No risk-result.json found")
      try:
          data = json.loads(found[0])
      except Exception as e:
          return (False, f"Invalid JSON: {e}")
      required = ["pr_url", "tier", "reason", "deciding_facts", "guidance_read"]
      missing = [f for f in required if f not in data]
      if missing:
          return (False, f"Missing fields: {', '.join(missing)}")
      if data["tier"] not in ("low", "moderate", "critical"):
          return (False, f"Unknown tier {data['tier']!r}")
      if not isinstance(data["reason"], str) or len(data["reason"].strip()) < 80:
          return (False, "The reason is missing or too short to audit")
      return (True, f"Valid result: {data['tier']}")

  - name: tier_correct
    description: Verify the tier matches the expected or an acceptable one
    check: |
      import json
      ann = outputs.get("annotations", {})
      files = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      found = [v for k, v in files.items() if k.endswith("risk-result.json")]
      if not found:
          return (False, "No risk-result.json found")
      try:
          got = str(json.loads(found[0]).get("tier", "")).lower()
      except Exception as e:
          return (False, f"Invalid JSON: {e}")
      expected = ann.get("expected_tier")
      acceptable = ann.get("acceptable_tiers", [expected])
      if got in acceptable:
          return (True, f"tier={got} (expected {expected})")
      return (False, f"tier={got}, expected one of {acceptable}")

  - name: guidance_read
    description: >
      Verify progressive disclosure: the run read the repository guidance index
      and the topic files the case's diff clearly maps to
    check: |
      import posixpath
      ann = outputs.get("annotations", {})
      required = ann.get("guidance", [])
      if not required:
          return (True, "No repository guidance required")
      reads, commands = [], []
      for e in outputs.get("events", []):
          if e.get("type") != "assistant":
              continue
          for t in e.get("tools", []):
              inp = t.get("input") or {}
              if t.get("name") == "Read":
                  reads.append(str(inp.get("file_path", "")))
              elif t.get("name") == "Bash":
                  commands.append(str(inp.get("command", "")))
      def read(g):
          # A Read of the file under the skill directory, or a shell command
          # naming it (relative to the skill, or after cd into its directory).
          if any(r.endswith("pr-risk-assessment/" + g) for r in reads):
              return True
          folder, name = posixpath.split(g)
          return any(g in c or (folder in c and name in c) for c in commands)
      missing = [g for g in required if not read(g)]
      if missing:
          return (False, f"Guidance not read: {missing}")
      return (True, f"Read {len(required)} guidance file(s)")

  - name: pull_request_not_read
    description: >
      Verify no tool call read the pull request, its labels, comments, or
      searches from GitHub (a read would leak the expected tier)
    check: |
      import re
      pattern = re.compile(
          r"repos/[^/ ]+/[^/ ]+/(pulls|issues|events)\b|github[.]com/[^/ ]+/[^/ ]+/(pull|pulls|issues)/"
          r"|commits/[0-9a-f]+/pulls|\bgh +(pr|issue|search)\b|search/(issues|code|commits)\b|graphql|/evals/")
      events = outputs.get("events", [])
      results = {e.get("tool_use_id"): e for e in events if e.get("type") == "tool_result"}
      leaks = []
      for e in events:
          if e.get("type") != "assistant":
              continue
          for t in e.get("tools", []):
              if t.get("name") not in ("Bash", "WebFetch", "Read", "Grep", "Glob"):
                  continue
              text = str(t.get("input"))
              if pattern.search(text) and not results.get(t.get("id"), {}).get("is_error"):
                  leaks.append(text[:160])
      if leaks:
          return (False, f"Unblocked reads: {leaks[:3]}")
      return (True, "No pull request read reached GitHub")

  # ── LLM judges ──

  - name: reason_quality
    description: Does the reason name the runtime change and the blast radius that decide the tier?
    score_range: [1, 5]
    prompt: |
      You are grading a pull request risk assessment against verified ground
      truth. The tiers mean: Low, no product behaviour change; Moderate, might
      impact product behaviour, but not disruptively; Critical, impacts product
      behaviour and could be disruptive if wrong.

      Run result (risk-result.json):
      {% for path, content in outputs.files.items() if path.endswith('risk-result.json') %}
      {{ content }}
      {% endfor %}

      Expected outcome and ground truth:

      {{ annotations }}

      Score 1-5:

      Score 1: Wrong tier, or the reason misstates what the change does.
      Score 2: Right tier, but for reasons that miss the mechanism the ground
               truth names as deciding.
      Score 3: Right tier and roughly the right mechanism, but vague about who
               receives the change, or with a factual error.
      Score 4: Right tier; names the deciding mechanism, who receives the change
               and when, and the blast radius; no factual errors.
      Score 5: Everything in 4, concise and auditable by a reviewer, and states
               what could not be determined where that mattered.

thresholds:
  result_json_valid:
    min_pass_rate: 1.0
  tier_correct:
    min_pass_rate: 1.0
  guidance_read:
    min_pass_rate: 1.0
  pull_request_not_read:
    min_pass_rate: 1.0
  reason_quality:
    min_mean: 3.5
