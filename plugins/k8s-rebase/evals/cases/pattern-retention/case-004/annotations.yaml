notes: >
  openshift/ingress-node-firewall — manages EgressFirewall node-level
  rules. Narrow k8s API surface; expect go.mod/vendor changes plus a
  small number of .go call-site fixes. IngressNodeFirewall CRD types
  are defined in openshift/api (an indirect dep) and are read-only from
  this repo's perspective — a diff touching them is almost certainly
  out-of-scope.
