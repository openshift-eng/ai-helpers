notes: >
  openshift/ingress-node-firewall — operator that deploys a daemon
  enforcing node-level ingress firewall rules. Narrow k8s API surface;
  expect go.mod/vendor changes plus a small number of .go call-site fixes.
  The IngressNodeFirewall CRD types live in this repo's api/v1alpha1;
  regenerated deepcopy code and CRD manifests are expected, while hand
  edits to the type definitions are a scope-creep signal.
