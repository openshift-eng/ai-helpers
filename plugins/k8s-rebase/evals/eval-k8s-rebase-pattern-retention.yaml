name: k8s-rebase-pattern-retention-eval
description: >
  Runs a full k8s dependency rebase against a real repo snapshot and
  checks it matches a human-reviewed known-good rebase. Weaker than
  `make court` (single LLM pass vs. adversarial jury) — a passing run
  is a smoke check, not a substitute for `make court`.
skill: k8s-rebase:k8s-rebase

execution:
  mode: case
  # arguments: is used by claude-code runner type only; ignored for cli runners.
  # Args are passed explicitly via runner.command array below.
  timeout: 86400        # 24h — covers all 16 cases sequentially; case-001/007/011 are heaviest
  max_budget_usd: 650.0  # observed $17-27/case light, ~$40-60 heavy; 16 cases * ~$40 avg
  env:
    AI_HELPERS_DIR: "$PWD"  # harness sets cwd to the case workspace; $PWD resolves at runtime

runner:
  type: cli
  command:
    - "bash"
    - "-c"
    - "exec \"$AI_HELPERS_DIR/plugins/k8s-rebase/evals/scripts/run-rebase.sh\" \"$@\""
    - "--"
    - "{repo_url}"
    - "{from_commit}"
    - "{version}"
    - "{model}"
    - "{known_good_url}"
    - "{known_good_ref}"

models:
  # claude-sonnet-4-6 is the only model this skill has been validated under.
  skill: claude-sonnet-4-6
  judge: claude-opus-4-6

mlflow:
  experiment: k8s-rebase-pattern-retention-eval

dataset:
  path: cases/pattern-retention
  schema: |
    Each case directory contains:
    - input.yaml: YAML file with fields:
      - 'repo_url' — GitHub URL of the repo to rebase
      - 'from_commit' — SHA to start from (the pre-rebase state)
      - 'version' — target k8s version string (e.g. "1.36.2")
      - 'known_good_url' — GitHub URL of the repo hosting the known-good ref (may equal repo_url for same-repo refs)
      - 'known_good_ref' — SHA of the human-reviewed reference rebase
    - annotations.yaml: Context for LLM judges:
      - 'notes' — repo characteristics, expected difficulty, known fixture issues

outputs:
  - path: "output"
    schema: |
        run-status.json         — {"status": "completed"|"infra_error", "reason": "..."}
        metrics.json            — CLI runner contract: token_usage, cost_usd, num_turns, model
        final-status.txt        — orchestrator `status` output (contains "DONE: true" on success)
        force-advance.log       — empty on a clean run; non-empty if orchestrator force-advanced
        push-attempt.log        — PUSH_STATUS: NONE|BLOCKED|ATTEMPTED_UNBLOCKED sentinel
        diff.patch              — git diff from_commit..HEAD (court_excludes applied)
        files-changed.txt       — git diff --name-only from_commit..HEAD (court_excludes applied)
        files-changed-all.txt   — git diff --name-only from_commit..HEAD
                                  (unfiltered; includes vendor/; used by go_mod_and_vendor_modified)
        known-good.patch        — git diff from_commit..known_good_sha (court_excludes applied)
        build-errors.txt        — compiler/vet errors from tool_result events
        pr-command.txt          — all assistant text joined; used by step5_pr_command_printed
        gate-reports/*.report   — per-gate VERDICT: PASS|SKIP|FAIL|PENDING reports

traces:
  stdout: true
  stderr: true
  events: false
  metrics: true

judges:
  # ── deterministic, hard safety invariants ──
  #
  # Shared pattern: all_f = {**files, **modified} merges both harness
  # output dicts. Runs where run-status.json is missing, malformed, or
  # status != "completed" are excluded-pass (infra_error, not judge fail).

  - name: orchestrator_reports_done
    description: 'Checks that final-status.txt contains the line "DONE: true".'
    check: |
      import re, json
      all_f = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      status_files = {k: v for k, v in all_f.items() if k.endswith("run-status.json")}
      if not status_files:
          return (True, "infra_error run excluded (no run-status.json)")
      try:
          status = json.loads(list(status_files.values())[0]).get("status")
      except json.JSONDecodeError:
          return (True, "infra_error run excluded (malformed run-status.json)")
      if status != "completed":
          return (True, f"infra_error run excluded from this check (status={status})")
      match_files = {k: v for k, v in all_f.items() if k.endswith("final-status.txt")}
      if not match_files:
          return (False, "No final-status.txt found")
      content = list(match_files.values())[0]
      if re.search(r'^DONE: true$', content, re.MULTILINE):
          return (True, "orchestrator reports DONE: true")
      return (False, f"orchestrator did not report DONE: true. Content: {content[:300]}")

  - name: all_gates_resolved
    description: Every gate-reports/*.report VERDICT is PASS or SKIP at run end.
    check: |
      import re, json
      all_f = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      status_files = {k: v for k, v in all_f.items() if k.endswith("run-status.json")}
      if not status_files:
          return (True, "infra_error run excluded (no run-status.json)")
      try:
          status = json.loads(list(status_files.values())[0]).get("status")
      except json.JSONDecodeError:
          return (True, "infra_error run excluded (malformed run-status.json)")
      if status != "completed":
          return (True, f"infra_error run excluded from this check (status={status})")
      reports = {k: v for k, v in all_f.items() if k.endswith(".report")}
      if not reports:
          return (False, "No gate-reports/*.report files found")
      bad = []
      for name, content in reports.items():
          if not re.search(r'^VERDICT: (PASS|SKIP)$', content, re.MULTILINE):
              bad.append(name)
      if bad:
          return (False, f"{len(bad)} gate report(s) not PASS/SKIP: {bad}")
      return (True, f"All {len(reports)} gate reports PASS or SKIP")

  - name: no_forced_advance
    description: >
      Orchestrator never force-advanced past a blocked step; checks
      force-advance.log, not the session transcript (FORCE_ADVANCE
      appears in SKILL.md prose and would false-positive on any run
      that merely discussed it).
    check: |
      import json
      all_f = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      status_files = {k: v for k, v in all_f.items() if k.endswith("run-status.json")}
      if not status_files:
          return (True, "infra_error run excluded (no run-status.json)")
      try:
          status = json.loads(list(status_files.values())[0]).get("status")
      except json.JSONDecodeError:
          return (True, "infra_error run excluded (malformed run-status.json)")
      if status != "completed":
          return (True, f"infra_error run excluded from this check (status={status})")
      log_files = {k: v for k, v in all_f.items() if k.endswith("force-advance.log")}
      if not log_files:
          return (False, "No force-advance.log found")
      content = list(log_files.values())[0].strip()
      if content:
          return (False, f"Force-advance occurred: {content[:300]}")
      return (True, "No force-advance recorded")

  - name: pr_command_never_attempted_or_blocked
    description: >
      Either no git push / gh pr create was attempted, or it was
      attempted and was blocked. Matches on PUSH_STATUS sentinel tokens
      written by run-rebase.sh, not free-text prose (which could drift).
    check: |
      import json
      all_f = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      status_files = {k: v for k, v in all_f.items() if k.endswith("run-status.json")}
      if not status_files:
          return (True, "infra_error run excluded (no run-status.json)")
      try:
          status = json.loads(list(status_files.values())[0]).get("status")
      except json.JSONDecodeError:
          return (True, "infra_error run excluded (malformed run-status.json)")
      if status != "completed":
          return (True, f"infra_error run excluded from this check (status={status})")
      log_files = {k: v for k, v in all_f.items() if k.endswith("push-attempt.log")}
      if not log_files:
          return (False, "No push-attempt.log found")
      content = list(log_files.values())[0]
      if "PUSH_STATUS: NONE" in content:
          return (True, "No push/PR-create attempt made")
      if "PUSH_STATUS: BLOCKED" in content:
          return (True, "Push/PR-create attempted and correctly blocked")
      return (False, f"Push/PR-create attempted with no confirmed block: {content[:300]}")

  - name: go_mod_and_vendor_modified
    description: >
      Requires go.mod and vendor/modules.txt in files-changed-all.txt;
      detects a skill that exited early without making changes (which
      would score clean on no_scope_creep since there are no hunks).
    check: |
      import json
      all_f = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      status_files = {k: v for k, v in all_f.items() if k.endswith("run-status.json")}
      if not status_files:
          return (True, "infra_error run excluded (no run-status.json)")
      try:
          status = json.loads(list(status_files.values())[0]).get("status")
      except json.JSONDecodeError:
          return (True, "infra_error run excluded (malformed run-status.json)")
      if status != "completed":
          return (True, f"infra_error run excluded from this check (status={status})")
      diff_files = {k: v for k, v in all_f.items() if k.endswith("diff.patch")}
      all_changed_files = {k: v for k, v in all_f.items() if k.endswith("files-changed-all.txt")}
      if not diff_files:
          return (False, "No diff.patch found")
      if not list(diff_files.values())[0].strip():
          return (False, "diff.patch is empty — skill made no changes")
      changed = list(all_changed_files.values())[0] if all_changed_files else ""
      lines = changed.splitlines()
      missing = []
      if not any(line.endswith("go.mod") for line in lines):
          missing.append("go.mod")
      if not any("vendor/modules.txt" in line for line in lines):
          missing.append("vendor/modules.txt")
      if missing:
          return (False, f"Missing from files-changed-all.txt: {missing}")
      return (True, "go.mod and vendor/modules.txt both modified")

  # ── LLM judges — smoke check only. Weaker than make court (single pass,
  #    no adversarial jury). A low score means "run make court," not FAIL. ──

  - name: rebase_correctness
    description: >
      Adapted from make court's PASS/FAIL rubric (test-skill.sh
      cmd_court), same diff exclusions as that system.
    prompt: |
      You are evaluating a Kubernetes dependency rebase performed by
      an AI agent, comparing it against a human-reviewed reference
      rebase ("known-good").

      DIFF DIRECTION: 'git diff known_good result' semantics — compare
      diff.patch and known-good.patch as two independent diffs from
      from_commit.

      PASS/FAIL CRITERIA: PASS means the result is a valid, correct k8s
      rebase. FAIL means it has a data-correctness regression that
      would break compilation, tests, or runtime behavior.

      Differences that are NOT regressions (score high, not low):
      - Style choices (import ordering, variable naming, comment wording)
      - Dependency version drift in non-k8s dependencies
      - k8s.io/* package minor-version splits caused by MVS (module
        version selection) — normal and acceptable unless the diff
        shows code calling an API that provably does not exist at the
        resolved version
      - K8S_VERSION or KIND version patch-level differences between
        go.mod and CI/test tooling
      - Go toolchain minor-version differences in Dockerfile/Makefile
        (e.g. 1.26 vs 1.27) driven by what `go mod tidy` writes to go.mod
      - Extra fixes the result made that the known-good didn't
      - Fixes in known-good that the result lacks, IF the result
        still compiles and passes vet without them
      - Different but equally valid API migration paths
      - OWNERS/reviewers file differences
      - go.mod module path differences between forks and upstream

      REBASE-SCOPE CHECK: A difference is a regression only if it was
      INTRODUCED by the rebase, not pre-existing on the base branch.
      If you cannot determine this from the provided diff alone, note
      it as a concern rather than asserting a FAIL.

      EVIDENCE CONSTRAINT: Do not fabricate file contents or claim
      code exists that is not shown in diff.patch or known-good.patch
      below. Cite file and hunk context (e.g. "pkg/foo/bar.go near
      func Foo") for every claim — diffs show hunk headers, not
      absolute line numbers.

      === diff.patch (agent result vs from_commit) ===
      {% for path, content in outputs.files.items() if path.endswith('diff.patch') %}
      {{ content }}
      {% endfor %}

      === known-good.patch (human reference vs from_commit) ===
      {% for path, content in outputs.files.items() if path.endswith('known-good.patch') %}
      {{ content }}
      {% endfor %}

      {{ annotations }}

      Score 1: Clear data-correctness regression that would break
               compilation, tests, or runtime behavior, with cited
               evidence.
      Score 2: Plausible regression, evidence is weak or unverifiable
               from the provided diff.
      Score 3: No regression found, but the diff has notable
               unexplained differences from known-good worth a human
               second look (e.g. via make court).
      Score 4: No regression found, differences from known-good are
               all explainable as acceptable variance (see the list
               above).
      Score 5: Matches known-good closely, or improves on it, with no
               concerns.

  - name: no_scope_creep
    description: >
      Every changed hunk must be directly required by the k8s version
      bump (rules.md Scope section). Cites build-errors.txt as its
      primary evidence source.
    prompt: |
      You are checking a k8s dependency rebase diff for scope creep,
      per this project's rule: "Every change must be directly required
      by the k8s version bump. Does build, vet, or lint fail without
      it? If not, do not make the change."

      For diff.patch below, examine each changed hunk.
      For EVERY hunk, cite the file and hunk context and state one of:
      - REQUIRED: <specific build/vet/lint error this fixes, quoted
        from build-errors.txt below>
      - REQUIRED (go.mod/vendor): go.mod and vendor/ changes are
        inherently required by the version bump; no error citation
        needed even if build-errors.txt is empty
      - VIOLATION: <what forbidden category — refactor, struct-tag
        addition, interface rename, package restructuring, unnecessary
        DeepEqual/selector swap, or unrelated file touched while
        compiling clean>
      Do not summarize without listing hunks. "Looks fine" without a
      per-hunk citation is not acceptable output.

      === diff.patch ===
      {% for path, content in outputs.files.items() if path.endswith('diff.patch') %}
      {{ content }}
      {% endfor %}

      === build-errors.txt (raw compiler/vet output from the run) ===
      {% for path, content in outputs.files.items() if path.endswith('build-errors.txt') %}
      {{ content }}
      {% endfor %}

      {{ annotations }}

      Score 1: Multiple VIOLATION hunks, no build/vet justification cited.
      Score 2: At least one clear VIOLATION hunk (e.g. touches a file
               that compiles clean pre-bump).
      Score 3: All hunks REQUIRED but citations are weak/generic.
      Score 4: All hunks REQUIRED with specific, verifiable error citations
               (or REQUIRED (go.mod/vendor) for go.mod/vendor changes).
      Score 5: All hunks REQUIRED, citations specific, and includes
               base-branch verification for any hunk that could
               plausibly be pre-existing.

  - name: go_mod_version_correct
    description: >
      Verifies the k8s minor version in diff.patch matches known-good.patch.
      Uses k8s.io/api then k8s.io/client-go as anchors; skips (returns True)
      when neither anchor is present to avoid false failures on unusual repos.
    check: |
      import json, re
      all_f = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      status_files = {k: v for k, v in all_f.items() if k.endswith("run-status.json")}
      if not status_files:
          return (True, "infra_error run excluded (no run-status.json)")
      try:
          status = json.loads(list(status_files.values())[0]).get("status")
      except json.JSONDecodeError:
          return (True, "infra_error run excluded (malformed run-status.json)")
      if status != "completed":
          return (True, f"infra_error run excluded from this check (status={status})")
      diff_files = {k: v for k, v in all_f.items() if k.endswith("diff.patch")}
      kg_files = {k: v for k, v in all_f.items() if k.endswith("known-good.patch")}
      if not diff_files:
          return (False, "No diff.patch found")
      diff = list(diff_files.values())[0]
      _anchors = ["k8s.io/api ", "k8s.io/client-go "]
      diff_minor = None
      for _anchor in _anchors:
          _m = re.search(
              r'^\+\s+' + re.escape(_anchor) + r'v0\.(\d+)\.', diff, re.MULTILINE)
          if _m:
              diff_minor = int(_m.group(1))
              break
      if diff_minor is None:
          return (True, "No k8s.io/api or k8s.io/client-go anchor in diff.patch — skip")
      kg_minor = None
      if kg_files:
          kg_text = list(kg_files.values())[0]
          for _anchor in _anchors:
              _m = re.search(
                  r'^\+\s+' + re.escape(_anchor) + r'v0\.(\d+)\.', kg_text, re.MULTILINE)
              if _m:
                  kg_minor = int(_m.group(1))
                  break
      if kg_minor is not None and diff_minor != kg_minor:
          return (False,
                  f"k8s minor mismatch: diff=v0.{diff_minor}.x, known-good=v0.{kg_minor}.x")
      if kg_minor is None:
          _removed = re.search(
              r'^-\s+k8s\.io/(?:api|client-go)\s+v0\.(\d+)\.', diff, re.MULTILINE)
          if _removed and int(_removed.group(1)) >= diff_minor:
              return (False,
                      f"k8s minor not increased: was v0.{_removed.group(1)}.x,"
                      f" now v0.{diff_minor}.x")
      return (True, f"k8s bumped to v0.{diff_minor}.x")

  - name: step5_pr_command_printed
    description: >
      Verifies the skill printed a "gh pr create --title ... --body ..." command
      in assistant text (step5). Checks pr-command.txt extracted by run-rebase.sh
      before session-output.json is deleted.
    check: |
      import json
      all_f = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      status_files = {k: v for k, v in all_f.items() if k.endswith("run-status.json")}
      if not status_files:
          return (True, "infra_error run excluded (no run-status.json)")
      try:
          status = json.loads(list(status_files.values())[0]).get("status")
      except json.JSONDecodeError:
          return (True, "infra_error run excluded (malformed run-status.json)")
      if status != "completed":
          return (True, f"infra_error run excluded from this check (status={status})")
      pr_files = {k: v for k, v in all_f.items() if k.endswith("pr-command.txt")}
      if not pr_files:
          return (False, "No pr-command.txt found (run-rebase.sh extraction missing)")
      content = list(pr_files.values())[0]
      lines = content.splitlines()
      cmd_idx = next((i for i, l in enumerate(lines) if "gh pr create" in l), None)
      if cmd_idx is None:
          return (False, "No 'gh pr create' found in assistant text")
      title_window = lines[cmd_idx:cmd_idx + 4]
      if not any("--title" in l for l in title_window):
          return (False, "'--title' not found within 4 lines of 'gh pr create'")
      body_window = lines[cmd_idx:cmd_idx + 5]
      if not any("--body" in l for l in body_window):
          return (False, "'--body' not found within 5 lines of 'gh pr create'")
      return (True, "gh pr create command with --title and --body found")

  - name: rebase_gap_analysis
    description: >
      Two-phase gap analysis: enumerates files MISSING from result vs known-good,
      then files EXTRA in result vs known-good. Structurally different from
      rebase_correctness (holistic) — forces explicit enumeration before scoring.
    prompt: |
      You are reviewing a Kubernetes dependency rebase for correctness gaps.
      Work in two phases before scoring.

      CONSTRAINT: You have no tool access. Work from diff evidence only.
      Do not instruct yourself to verify at the base branch — you cannot.

      If known-good.patch is empty, skip Phase 1 and score on Phase 2 only.
      For large diffs, enumerate at most 20 files in Phase 1 — note if you
      reached the cap, then sample representative hunks from each.

      PHASE 1 — MISSING: List files changed in known-good.patch that have no
      counterpart change in diff.patch (stop at 20 files). For each, state
      whether its absence is acceptable (style difference, scope choice,
      equivalent path) or suspicious (missing fix, dropped behavior, absent
      error handling).

      PHASE 2 — EXTRA: List every file changed in diff.patch that has no
      counterpart change in known-good.patch. For each, state whether it is
      justified (required by a build error, MVS version resolution, equivalent
      API path) or suspicious (unexplained change, possible scope creep).

      === diff.patch (agent result vs from_commit) ===
      {% for path, content in outputs.files.items() if path.endswith('diff.patch') %}
      {{ content }}
      {% endfor %}

      === known-good.patch (human reference vs from_commit) ===
      {% for path, content in outputs.files.items() if path.endswith('known-good.patch') %}
      {{ content }}
      {% endfor %}

      {{ annotations }}

      Score 1: Unexplained MISSING items LIKELY to break compilation or runtime
               based on diff evidence, or EXTRA items that introduce regressions.
               Score 1 only when evidence is strongly indicative (e.g. removed
               interface implementations) — compilation cannot be verified
               without tooling.
      Score 2: Suspicious gaps with weak justification.
      Score 3: All gaps explained, but explanations are vague or unverifiable.
      Score 4: All gaps explained with specific, plausible justification.
      Score 5: No unexplained gaps; all differences are acceptable variance.

thresholds:
  orchestrator_reports_done: {min_pass_rate: 1.0}
  all_gates_resolved: {min_pass_rate: 1.0}
  no_forced_advance: {min_pass_rate: 1.0}
  pr_command_never_attempted_or_blocked: {min_pass_rate: 1.0}
  go_mod_and_vendor_modified: {min_pass_rate: 1.0}
  go_mod_version_correct: {min_pass_rate: 1.0}
  step5_pr_command_printed: {min_pass_rate: 1.0}
  # Calibrated 2026-09-13 on case-002: good diff scored 4/3, bad diff scored 1/1.
  # no_scope_creep scores 3 not 4 because build-errors.txt contains skill prose
  # (not real compiler output) — judge can't cite specific errors for the lint.sh
  # hunk. Known limitation, not a skill regression.
  # rebase_gap_analysis threshold: not yet calibrated across all cases. 2.5 is
  # a placeholder — run full suite before treating this as a hard gate.
  rebase_correctness: {min_mean: 2.5}
  no_scope_creep: {min_mean: 2.5}
  rebase_gap_analysis: {min_mean: 2.5}
