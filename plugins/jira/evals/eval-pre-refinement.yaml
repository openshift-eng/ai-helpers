name: pre-refinement-eval
description: >
  Evaluate the pre-refinement skill on single TRT cards in dry-run mode:
  eligibility, duplicate detection, the stricter review for assistant-drafted
  cards, the choice between no change, a proposal and a gap comment, and
  whether a proposal is concise while preserving every criterion, link,
  boundary and fact the card relies on. Uses static fixtures, with no live Jira dependency.
execution:
  mode: case
  skill: jira:pre-refinement
  arguments: "{issue_key} --mode dry-run"
  timeout: 600
  max_budget_usd: 2.00

runner:
  type: claude-code
  plugin_dirs:
    - plugins/jira
  system_prompt: |
    You are an eval runner. Run the pre-refinement skill in dry-run mode on
    the card in input.yaml. There is no live Jira access: use the fixtures
    instead of Jira tools.

    - input.yaml has `issue_key`, the card under `card` (key, issue_type,
      status, summary, description, labels, creator, and optional links and
      comments), and `search_results`: the cards both duplicate searches
      return. Use `search_results` for both the semantic and the JQL pass.
    - The conventions file is plugins/jira/reference/trt.md. Read it in full.
    - Run plugins/jira/skills/pre-refinement/scripts/check_card.py on the
      card, and again with your proposal, as the skill describes.

    Write result.json containing exactly one card record in the skill's
    "Result" format (key, issue_type, outcome, readiness, stricter_review,
    rubric, duplicate_of, related, proposed_links, proposed_summary,
    proposed_description, gap_comment, change_notes, preservation_passed,
    skip_reason).

    Do not wrap JSON in markdown code fences in the file.
    Do NOT attempt to connect to Jira or use any MCP tools.

models:
  skill: claude-opus-4-6
  judge: claude-opus-4-6

permissions:
  allow:
    - "Read"
    - "Write"
    - "Bash"
    - "Glob"
    - "Grep"
  deny:
    - "Agent"
    - "mcp__*"

mlflow:
  experiment: pre-refinement-eval

dataset:
  path: cases/pre-refinement
  schema: |
    Each case directory contains:
    - input.yaml:
      - 'issue_key': synthetic TRT key
      - 'card': the card (key, issue_type, status, summary, description,
        labels, creator, optional links and comments)
      - 'search_results': candidate cards both duplicate searches return
        (key, issue_type, status, resolution, resolved, summary, description)
    - annotations.yaml:
      - 'expected_key': the key result.json must report
      - 'expected_outcome' and optional 'acceptable_outcomes'
      - 'expected_readiness': ready, needs_info or null (optional)
      - 'expected_stricter_review' and 'expected_stricter_reasons'
      - 'expected_duplicate_of': key or null
      - 'expected_related': keys that must appear in 'related' (optional)
      - 'expected_links': the keys 'proposed_links' must name, exactly
      - 'must_keep': strings the proposed summary and description together
        must contain, ignoring case except in URLs, and not as part of a
        longer word or number; a list entry accepts any of its alternatives
        (proposal cases). For exact tokens: keys, URLs, names, error strings.
      - 'must_keep_facts': statements a proposal must keep in meaning, in any
        wording, judged by facts_preserved; each entry's optional 'numbers'
        must also appear in the proposal, as digits or words (proposal cases)
      - 'must_not_add': strings that would mean invented content (optional)
      - 'max_words': upper bound for the proposed description (optional)
      - 'gap_comment_required' and 'gap_comment_mentions_any' (optional)
      - 'ground_truth': the expected judgment, for the LLM judges

outputs:
  - path: "result.json"
    schema: |
      One card record in the skill's "Result" format.

traces:
  stdout: true
  stderr: true
  events: false
  metrics: true

judges:
  - name: valid_output_json
    description: result.json is one valid card record
    check: |
      import json
      files = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      found = [v for k, v in files.items() if k.endswith("result.json")]
      if not found:
          return (False, "No result.json found")
      try:
          data = json.loads(found[0])
      except Exception as e:
          return (False, f"Invalid JSON: {e}")
      if not isinstance(data, dict):
          return (False, "result.json is not an object")
      ann = outputs.get("annotations", {})
      required = ["key", "issue_type", "outcome", "readiness", "stricter_review",
                  "rubric", "duplicate_of", "related", "proposed_links", "proposed_summary",
                  "proposed_description", "gap_comment", "change_notes",
                  "preservation_passed", "skip_reason"]
      missing = [f for f in required if f not in data]
      if missing:
          return (False, f"Missing fields: {', '.join(missing)}")
      allowed = {"proposal", "no_change", "gaps_only", "duplicate",
                 "unsupported", "skipped", "blocked"}
      if not isinstance(data["outcome"], str) or data["outcome"] not in allowed:
          return (False, f"Invalid outcome: {data['outcome']!r}")
      if ann.get("expected_key") and data["key"] != ann["expected_key"]:
          return (False, f"key={data['key']}, expected={ann['expected_key']}")
      def str_or_null(v):
          return v is None or isinstance(v, str)
      errors = []
      if not isinstance(data["key"], str):
          errors.append("key is not a string")
      for f in ("issue_type", "proposed_summary", "proposed_description", "gap_comment", "skip_reason"):
          if not str_or_null(data[f]):
              errors.append(f"{f} is not a string or null")
      if data["readiness"] not in ("ready", "needs_info", None):
          errors.append(f"invalid readiness {data['readiness']!r}")
      sr = data["stricter_review"]
      if not (isinstance(sr, dict) and isinstance(sr.get("applied"), bool)
              and isinstance(sr.get("reasons"), list)):
          errors.append("stricter_review needs a boolean 'applied' and a list of 'reasons'")
      if not (data["rubric"] is None or isinstance(data["rubric"], dict)):
          errors.append("rubric is not an object or null")
      dup = data["duplicate_of"]
      if not (dup is None or (isinstance(dup, dict) and isinstance(dup.get("key"), str))):
          errors.append("duplicate_of is not null or an object with a key")
      related = data["related"]
      if related is None:
          if data["outcome"] != "skipped":
              errors.append("related is null for a card that was not skipped; use []")
      elif not (isinstance(related, list) and all(isinstance(k, str) for k in related)):
          errors.append("related is not a list of keys or null")
      links = data["proposed_links"]
      if not (isinstance(links, list) and all(
              isinstance(l, dict) and all(isinstance(l.get(f), str) for f in ("key", "link_type", "rationale"))
              for l in links)):
          errors.append("proposed_links is not a list of {key, link_type, rationale}")
      if not (data["change_notes"] is None or isinstance(data["change_notes"], list)):
          errors.append("change_notes is not a list or null")
      if not (data["preservation_passed"] is None or isinstance(data["preservation_passed"], bool)):
          errors.append("preservation_passed is not a boolean or null")
      # A proposal that failed preservation must not be shown. null is the
      # by-hand review when check_card.py itself fails.
      if data["outcome"] == "proposal" and data["preservation_passed"] is False:
          errors.append("proposal reports a failed preservation check")
      if errors:
          return (False, "; ".join(errors))
      return (True, "Valid card record")

  - name: outcome_correct
    description: The outcome matches the expected one
    check: |
      import json
      ann = outputs.get("annotations", {})
      files = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      found = [v for k, v in files.items() if k.endswith("result.json")]
      if not found:
          return (False, "No result.json found")
      try:
          data = json.loads(found[0])
      except Exception as e:
          return (False, f"Cannot parse JSON: {e}")
      acceptable = ann.get("acceptable_outcomes") or [ann["expected_outcome"]]
      got = data.get("outcome")
      if got in acceptable:
          return (True, f"outcome={got}")
      return (False, f"outcome={got}, expected one of {acceptable}")

  - name: readiness_correct
    description: Readiness matches the expected value, when one is given
    check: |
      import json
      ann = outputs.get("annotations", {})
      if "expected_readiness" not in ann:
          return (True, "No expected_readiness -- skipped")
      files = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      found = [v for k, v in files.items() if k.endswith("result.json")]
      if not found:
          return (False, "No result.json found")
      try:
          data = json.loads(found[0])
      except Exception as e:
          return (False, f"Cannot parse JSON: {e}")
      if data.get("readiness") == ann["expected_readiness"]:
          return (True, f"readiness={data.get('readiness')}")
      return (False, f"readiness={data.get('readiness')}, expected={ann['expected_readiness']}")

  - name: duplicate_correct
    description: A duplicate names the right card; a related card is not a duplicate
    check: |
      import json
      ann = outputs.get("annotations", {})
      files = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      found = [v for k, v in files.items() if k.endswith("result.json")]
      if not found:
          return (False, "No result.json found")
      try:
          data = json.loads(found[0])
      except Exception as e:
          return (False, f"Cannot parse JSON: {e}")
      dup = data.get("duplicate_of")
      got = dup.get("key") if isinstance(dup, dict) else dup
      expected = ann.get("expected_duplicate_of")
      if got != expected:
          return (False, f"duplicate_of={got}, expected={expected}")
      if expected and data.get("proposed_description"):
          return (False, "A duplicate must not also carry a rewrite")
      related = data.get("related") or []
      missing = [k for k in ann.get("expected_related", []) if k not in related]
      if missing:
          return (False, f"related is missing {missing}")
      return (True, f"duplicate_of={got}")

  - name: links_correct
    description: Links are proposed to exactly the related cards not yet linked, as Relates links
    check: |
      import json
      ann = outputs.get("annotations", {})
      if "expected_links" not in ann:
          return (False, "Case has no expected_links annotation")
      files = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      found = [v for k, v in files.items() if k.endswith("result.json")]
      if not found:
          return (False, "No result.json found")
      try:
          data = json.loads(found[0])
      except Exception as e:
          return (False, f"Cannot parse JSON: {e}")
      links = data.get("proposed_links") or []
      if not isinstance(links, list) or not all(
              isinstance(l, dict) and all(isinstance(l.get(f), str) for f in ("key", "link_type", "rationale"))
              for l in links):
          return (False, "proposed_links is not a list of {key, link_type, rationale} strings")
      errors = []
      keys = [l.get("key") for l in links]
      if sorted(set(keys)) != sorted(ann["expected_links"]):
          errors.append(f"links to {keys}, expected {ann['expected_links']}")
      if len(keys) != len(set(keys)):
          errors.append("a card is linked twice")
      related = data.get("related") or []
      for l in links:
          if l.get("link_type") != "Relates":
              errors.append(f"{l.get('key')}: link type {l.get('link_type')!r}, expected 'Relates'")
          if not (l.get("rationale") or "").strip():
              errors.append(f"{l.get('key')}: no rationale")
          if l.get("key") not in related:
              errors.append(f"{l.get('key')} is linked but not listed as related")
      if errors:
          return (False, "; ".join(errors[:5]))
      return (True, f"links={keys}")

  - name: stricter_review_correct
    description: The stricter review applies exactly when it should, for the right reasons
    check: |
      import json
      ann = outputs.get("annotations", {})
      if "expected_stricter_review" not in ann:
          return (True, "No expected_stricter_review -- skipped")
      files = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      found = [v for k, v in files.items() if k.endswith("result.json")]
      if not found:
          return (False, "No result.json found")
      try:
          data = json.loads(found[0])
      except Exception as e:
          return (False, f"Cannot parse JSON: {e}")
      sr = data.get("stricter_review") or {}
      if sr.get("applied") is not ann["expected_stricter_review"]:
          return (False, f"applied={sr.get('applied')}, expected={ann['expected_stricter_review']}")
      want = sorted(ann.get("expected_stricter_reasons", []))
      if sorted(sr.get("reasons") or []) != want:
          return (False, f"reasons={sr.get('reasons')}, expected={want}")
      if sr.get("applied") and data.get("outcome") in ("proposal", "no_change", "gaps_only"):
          rubric = data.get("rubric") or {}
          absent = [c for c in ("C1", "C2", "C3", "C4", "C5", "C6", "C7") if c not in rubric]
          if absent:
              return (False, f"stricter review without a rubric verdict for {absent}")
      return (True, f"stricter_review={sr}")

  - name: proposal_preserves_facts
    description: A proposal keeps every annotated fact, adds nothing invented, and drops the AI notice
    check: |
      import json
      ann = outputs.get("annotations", {})
      files = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      found = [v for k, v in files.items() if k.endswith("result.json")]
      if not found:
          return (False, "No result.json found")
      try:
          data = json.loads(found[0])
      except Exception as e:
          return (False, f"Cannot parse JSON: {e}")
      if data.get("outcome") != "proposal":
          return (True, "Not a proposal -- skipped")
      import re
      text = (data.get("proposed_summary") or "") + "\n" + (data.get("proposed_description") or "")
      def urls(t):
          # Complete link targets, as in check_card.py: Markdown destinations
          # (balanced parentheses at any depth), wiki links, <url>, raw URLs.
          out, pos = set(), 0
          for m in re.finditer(r"\[[^\]\n]*\]\((?=https?://)", t):
              depth, i = 0, m.end()
              while i < len(t) and not t[i].isspace() and not (t[i] == ")" and depth == 0):
                  depth += {"(": 1, ")": -1}.get(t[i], 0)
                  i += 1
              if i < len(t) and t[i] == ")":
                  out.add(t[m.end():i])
          out.update(re.findall(r"\[[^\]|\n]*\|(https?://[^\]\s]+)\]", t))
          out.update(re.findall(r"<(https?://[^>\s]+)>", t))
          out.update(u.rstrip(".,;:") for u in re.findall(r"https?://[^\s<>()\[\]|]+", t))
          return out
      targets = urls(text)
      def found(s):
          # A URL must be a complete link target, exactly; prose ignores case.
          # A value must not be part of a longer word or number: "3 failed"
          # not inside "13 failed", "keyboard" not inside "keyboarding".
          if s.startswith("http"):
              return s in targets
          return re.search(r"(?<!\w)" + re.escape(s) + r"(?!\w)", text, re.IGNORECASE) is not None
      errors = []
      for entry in ann.get("must_keep", []):
          options = entry if isinstance(entry, list) else [entry]
          if not any(found(s) for s in options):
              errors.append(f"dropped {entry!r}")
      # A fact's numbers must survive (its meaning is judged by facts_preserved).
      words = {1: "one", 2: "two", 3: "three", 4: "four", 5: "five", 6: "six", 7: "seven",
               8: "eight", 9: "nine", 10: "ten", 11: "eleven", 12: "twelve"}
      for fact in ann.get("must_keep_facts", []):
          for n in fact.get("numbers", []):
              pattern = r"(?<![\d.])" + re.escape(str(n)) + r"(?!\d|\.\d)"
              if n in words:
                  pattern += r"|\b" + words[n] + r"\b"
              if not re.search(pattern, text, re.IGNORECASE):
                  errors.append(f"dropped the number {n} from {fact['fact']!r}")
      errors += [f"added {s!r}" for s in ann.get("must_not_add", []) if s.lower() in text.lower()]
      # Same matcher as check_card.py's AI_NOTICE_RE.
      if re.search(r"AI-generated\.\s*Review for accuracy\.?", data.get("proposed_description") or "",
                   re.IGNORECASE):
          errors.append("kept the AI-generated notice")
      if errors:
          return (False, "; ".join(errors[:5]))
      return (True, f"All {len(ann.get('must_keep', []))} facts kept")

  - name: proposal_shape
    description: A proposal meets the mechanical rubric limits
    check: |
      import json, re
      ann = outputs.get("annotations", {})
      files = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      found = [v for k, v in files.items() if k.endswith("result.json")]
      if not found:
          return (False, "No result.json found")
      try:
          data = json.loads(found[0])
      except Exception as e:
          return (False, f"Cannot parse JSON: {e}")
      if data.get("outcome") != "proposal":
          return (True, "Not a proposal -- skipped")
      desc = data.get("proposed_description") or ""
      errors = []
      words = len(re.findall(r"[A-Za-z0-9][\w'./:-]*", re.sub(r"https?://\S+", "URL", desc)))
      if ann.get("max_words") and words > ann["max_words"]:
          errors.append(f"{words} words, limit {ann['max_words']}")
      fence = re.compile(r"```[^\n]*\n(.*?)```", re.DOTALL)
      for block in fence.findall(desc):
          if len([l for l in block.splitlines() if l.strip()]) > 5:
              errors.append("log or code excerpt over five lines")
      # Completion headings as in check_card.py; fenced lines are evidence.
      completion = ("acceptance criteria", "done when", "success criteria",
                    "validation and acceptance criteria", "definition of done",
                    "exit criteria", "additional acceptance criteria", "deliverable",
                    "findings documentation", "follow-up actions")
      body = fence.sub(lambda m: re.sub(r"[^\n]", " ", m.group(0)), desc)
      heading = re.compile(r"^\s*(?:#{1,6}\s+|h[1-6]\.\s+|\*\*)(.+?)(?:\*\*:?)?\s*$", re.MULTILINE)
      marks = list(heading.finditer(body))
      # The gap comment must at least mention a split; refinement_quality
      # judges whether it recommends one ("A split is not needed" does not).
      split = re.search(r"\bsplit", data.get("gap_comment") or "", re.IGNORECASE)
      for i, m in enumerate(marks):
          name = re.sub(r"\s*\([^)]*\)\s*$", "", m.group(1).strip("* :")).lower()
          if name in completion:
              end = marks[i + 1].start() if i + 1 < len(marks) else len(body)
              items = [l for l in body[m.end():end].splitlines() if re.match(r"^(?:[*\-+]|\d+[.)])\s+", l)]
              if len(items) > 5 and not split:
                  errors.append(f"{len(items)} criteria and no split proposed in the gap comment")
      # Raw URLs as in check_card.py: labelled links and <url> don't count.
      masked = re.sub(r"\[[^\]\n]*\]\((?:[^()\s]|\([^()\s]*\))+\)", "", desc)
      masked = re.sub(r"\[[^\]|\n]*\|[^\]\s]+\]", "", masked)
      masked = re.sub(r"<https?://[^>]+>", "", masked)
      if any(len(u.rstrip(".,;:")) > 100 for u in re.findall(r"https?://[^\s<>()\[\]|]+", masked)):
          errors.append("long raw URL left in place")
      summary = data.get("proposed_summary")
      if summary and not 5 <= len(summary.split()) <= 12:
          errors.append(f"summary has {len(summary.split())} words")
      if errors:
          return (False, "; ".join(errors))
      return (True, f"{words} words; limits met")

  - name: no_text_without_proposal
    description: Only a proposal carries proposed text; gap comments only where they belong
    check: |
      import json
      ann = outputs.get("annotations", {})
      files = {**outputs.get("files", {}), **outputs.get("modified_files", {})}
      found = [v for k, v in files.items() if k.endswith("result.json")]
      if not found:
          return (False, "No result.json found")
      try:
          data = json.loads(found[0])
      except Exception as e:
          return (False, f"Cannot parse JSON: {e}")
      outcome = data.get("outcome")
      errors = []
      if outcome != "proposal" and (data.get("proposed_summary") or data.get("proposed_description")):
          errors.append(f"{outcome} carries proposed text")
      if outcome in ("no_change", "duplicate", "unsupported", "skipped") and data.get("gap_comment"):
          errors.append(f"{outcome} carries a gap comment")
      if ann.get("gap_comment_required"):
          gap = (data.get("gap_comment") or "").lower()
          if not gap:
              errors.append("missing gap comment")
          elif ann.get("gap_comment_mentions_any") and not any(
                  w.lower() in gap for w in ann["gap_comment_mentions_any"]):
              errors.append(f"gap comment mentions none of {ann['gap_comment_mentions_any']}")
      if errors:
          return (False, "; ".join(errors))
      return (True, f"{outcome}: text fields consistent")

  - name: facts_preserved
    description: A proposal keeps each annotated fact in meaning, in any wording
    if: "annotations.get('must_keep_facts')"
    feedback_type: bool
    prompt: |
      You are checking one card from a TRT pre-refinement run. The skill may
      propose a shorter summary and description for a Jira card. Check whether
      that proposal still states each fact below with the same meaning.

      The skill's output (result.json):

      {{ outputs }}

      The facts the proposal must keep:
      {% for f in annotations.get('must_keep_facts') %}
      - {{ f.fact }}
      {%- endfor %}

      If the outcome in result.json is not "proposal", pass: there is no
      proposed text to check.

      Otherwise read proposed_summary and proposed_description together. For
      each fact, quote the proposal sentence that states it, or say it is
      absent. A fact is kept when:
      - every value (number, unit, threshold, name) is the same, and it is
        attached to the same behavior or rule. A value moved to a different
        rule, such as a flagging threshold that now describes retries, is not
        kept;
      - a boundary or condition keeps its scope: "out of scope" stays out of
        scope, "about" stays approximate, a requirement isn't weakened to an
        option;
      - wording, order and grouping may differ, and a fact may be merged into
        a longer bullet.

      Pass only if every fact is kept.

  - name: refinement_quality
    description: LLM judge of rubric application, preservation and restraint
    score_range: [1, 5]
    prompt: |
      You are evaluating one card from a TRT pre-refinement run. The skill
      checks a new Jira card against TRT's conventions (templates, readiness,
      the concision rubric C1-C7, the stricter review for assistant-drafted
      cards, and the preservation rules) and decides between no change, a
      proposal, a gap comment only, or a duplicate finding.

      The skill's output:

      {{ outputs }}

      The input card:

      {{ inputs }}

      The expected judgment:

      {{ annotations }}

      Score 1-5:

      Score 1: Wrong outcome, or the proposal invents content (a benefit,
               criterion, cause, scope or decision the card lacks) or drops a
               criterion, link, boundary or "unconfirmed" marker.
      Score 2: Right outcome, but the proposal weakens a criterion, misses an
               obvious rubric failure, the gap comment is vague ("add more
               detail"), the proposal keeps more than five acceptance
               criteria without a gap comment that recommends splitting the
               card (mentioning a split only to reject it does not count), or a proposed link's rationale only says the cards
               are related without saying how (follow-up, prerequisite, same
               component, same symptom with a different cause).
      Score 3: Right outcome and faithful, but noticeably wordier than needed
               or with gap questions that are hard to answer.
      Score 4: Right outcome; concise and faithful; gap questions are concrete
               and addressed to the reporter; change notes say what was kept;
               each proposed link's rationale names the relationship, in any
               wording.
      Score 5: As 4, and every rubric verdict cites the specific text it
               judged. A no-change or gaps-only outcome explains, check by
               check, why a rewrite would not help.

thresholds:
  valid_output_json:
    min_pass_rate: 1.0
  outcome_correct:
    min_pass_rate: 0.85
  readiness_correct:
    min_pass_rate: 0.75
  duplicate_correct:
    min_pass_rate: 1.0
  stricter_review_correct:
    min_pass_rate: 1.0
  links_correct:
    min_pass_rate: 1.0
  proposal_preserves_facts:
    min_pass_rate: 1.0
  facts_preserved:
    min_pass_rate: 1.0
  proposal_shape:
    min_pass_rate: 0.9
  no_text_without_proposal:
    min_pass_rate: 0.9
  refinement_quality:
    min_mean: 3.5
