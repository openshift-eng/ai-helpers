ground_truth: |
  A follow-up to TRT-9100, not a duplicate: TRT-9100 added the alert with a
  fixed threshold, and this card makes the threshold configurable per stream.
  Finishing TRT-9100 did not finish this card. It must be listed as related,
  and the card reviewed normally.

  The card itself is concise and complete (a user-story sentence, three
  testable criteria, one line of context with a link), so "no change" is
  expected. A minimal proposal is tolerated, but marking it a duplicate is a
  failure.
