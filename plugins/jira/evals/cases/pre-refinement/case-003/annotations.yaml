ground_truth: |
  A Bug written as a first-person narrative, with a 20-line label listing
  and a long raw URL. All required Bug content is present in prose: the
  problem (rescanning from a test details page completes but the page shows
  old labels), reproduction steps, expected versus actual, impact (can't
  break a regression down by a new symptom on the fly), and evidence.

  A good proposal restructures it into Problem, Steps to Reproduce, Expected
  vs Actual, Impact and Evidence; reduces the label listing to the two new
  labels that matter, with the run ID (C4); turns the raw URL into a labelled
  link with exactly the same target; keeps BigQuery and the Sippy PostgreSQL
  job runs list as where the labels do appear; and keeps the caching guess
  marked as unconfirmed. The summary names the symptom and where it occurs,
  for example "Test details rescan does not refresh labels". Stating the
  cause as fact, dropping the run ID or either new label, or changing the
  link target is a failure. TRT-8811 concerns the same job-run scanner but is
  a different defect (a timeout that writes no labels), so it is related, not
  a duplicate.
notes: Worked example E5 (narrative bug with a log dump), dropped from trt.md in review.
