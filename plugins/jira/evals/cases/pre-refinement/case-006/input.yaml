  summary: Alert when a payload stream stops accepting payloads
  labels: []
  creator: trt-engineer-d
  description: |
    We keep noticing late that a release stream has gone a whole day without an
    accepted payload. Add an alert to #trt-alert when any nightly stream has
    had no accepted payload for 24 hours.

    Done when:
    * An alert fires in #trt-alert when a nightly stream has no accepted
      payload for 24 hours.
    * The alert names the stream and links to its release controller page.
